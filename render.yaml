services:
  - type: web
    name: bugbounty-ai-v2
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SAFE_DEMO_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: HACKERONE_USERNAME
        sync: false
      - key: HACKERONE_API_TOKEN
        sync: false
