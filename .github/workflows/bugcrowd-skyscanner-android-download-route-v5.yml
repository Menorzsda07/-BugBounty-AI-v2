name: Bugcrowd Skyscanner Android Download Route V5

on:
  push:
    paths:
      - '.github/workflows/bugcrowd-skyscanner-android-download-route-v5.yml'
  workflow_dispatch:

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Uptodown public download javascript
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://skyscanner.en.uptodown.com/android/download'
          curl -sS -L --max-time 30 -H 'User-Agent: Mozilla/5.0' -o /tmp/page "$PAGE"
          JS=$(grep -Eo 'https://stc\.utdstc\.com/[0-9]+/download\.js' /tmp/page | head -n1)
          echo "JS=$JS"
          curl -sS -L --max-time 30 -H 'User-Agent: Mozilla/5.0' -o /tmp/dl.js "$JS"
          echo "JS_BYTES=$(wc -c </tmp/dl.js)"
          python3 - <<'PY'
          import re
          s=open('/tmp/dl.js',encoding='utf-8',errors='replace').read()
          terms=['fetch(','XMLHttpRequest','ajax','download','file-id','fileId','version','turnstile','api/','/ajax/','/download/','dw.uptodown','data-file-id']
          for t in terms:
            print('\n===',t,'===')
            lo=s.lower(); tt=t.lower(); pos=0; n=0
            while True:
              i=lo.find(tt,pos)
              if i<0 or n>=25: break
              print(s[max(0,i-700):min(len(s),i+1300)].replace('\n',' '))
              pos=i+len(tt); n+=1
            print('COUNT',n)
          urls=sorted(set(re.findall(r'["\']([^"\']*(?:download|variant|file|apk)[^"\']*)["\']',s,re.I)))
          print('\nCANDIDATE_STRINGS',len(urls))
          for x in urls[:120]: print(x[:1000])
          print('V5_ROUTE_DONE=1')
          PY
