name: CBMPC ECDSA2P Independent Process V23

on:
  push:
    paths:
      - '.github/workflows/cbmpc-ecdsa2p-independent-process-v23.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone current cb-mpc HEAD
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add two-process public-API identity-misbinding test
        shell: bash
        run: |
          set -euo pipefail
          cat >> cb-mpc/tests/unit/api/test_ecdsa2pc.cpp <<'CPP'

          #include <cerrno>
          #include <cstdint>
          #include <fstream>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          namespace {

          static bool v23_write_full(int fd, const void* p, size_t n) {
            const auto* b = static_cast<const uint8_t*>(p);
            while (n) {
              ssize_t k = ::write(fd, b, n);
              if (k < 0) { if (errno == EINTR) continue; return false; }
              if (k == 0) return false;
              b += static_cast<size_t>(k);
              n -= static_cast<size_t>(k);
            }
            return true;
          }

          static bool v23_read_full(int fd, void* p, size_t n) {
            auto* b = static_cast<uint8_t*>(p);
            while (n) {
              ssize_t k = ::read(fd, b, n);
              if (k < 0) { if (errno == EINTR) continue; return false; }
              if (k == 0) return false;
              b += static_cast<size_t>(k);
              n -= static_cast<size_t>(k);
            }
            return true;
          }

          class v23_pipe_transport_t final : public coinbase::api::data_transport_i {
           public:
            v23_pipe_transport_t(int rfd, int wfd) : rfd_(rfd), wfd_(wfd) {}
            ~v23_pipe_transport_t() override = default;

            coinbase::error_t send(coinbase::api::party_idx_t, coinbase::mem_t msg) override {
              const uint64_t n = static_cast<uint64_t>(msg.size());
              if (!v23_write_full(wfd_, &n, sizeof(n))) return E_NET_GENERAL;
              if (n && !v23_write_full(wfd_, msg.data(), static_cast<size_t>(n))) return E_NET_GENERAL;
              return SUCCESS;
            }

            coinbase::error_t receive(coinbase::api::party_idx_t, coinbase::buf_t& msg) override {
              uint64_t n = 0;
              if (!v23_read_full(rfd_, &n, sizeof(n))) return E_NET_GENERAL;
              if (n > (64ull << 20)) return E_RANGE;
              msg = coinbase::buf_t(static_cast<int>(n));
              if (n && !v23_read_full(rfd_, msg.data(), static_cast<size_t>(n))) return E_NET_GENERAL;
              return SUCCESS;
            }

            coinbase::error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,
                                           std::vector<coinbase::buf_t>& msgs) override {
              msgs.clear();
              msgs.resize(senders.size());
              for (size_t i = 0; i < senders.size(); ++i) {
                auto rv = receive(senders[i], msgs[i]);
                if (rv) return rv;
              }
              return SUCCESS;
            }

           private:
            int rfd_;
            int wfd_;
          };

          static int v23_party(bool is_p1, int rfd, int wfd) {
            using coinbase::api::curve_id;
            using coinbase::api::ecdsa_2p::party_t;
            v23_pipe_transport_t transport(rfd, wfd);

            const coinbase::api::job_2p_t setup{
              is_p1 ? party_t::p1 : party_t::p2, "alice", "bob", transport};
            coinbase::buf_t key;
            auto rv = coinbase::api::ecdsa_2p::dkg(setup, curve_id::secp256k1, key);
            if (rv != SUCCESS || key.empty()) return 20;

            const coinbase::api::job_2p_t mismatched{
              is_p1 ? party_t::p1 : party_t::p2,
              "alice",
              is_p1 ? "bob" : "mallory",
              transport};

            coinbase::buf_t hash(32);
            for (int i = 0; i < hash.size(); ++i) hash[i] = static_cast<uint8_t>(0xC1 + i);
            coinbase::buf_t sid;
            coinbase::buf_t sig;
            rv = coinbase::api::ecdsa_2p::sign(mismatched, key, hash, sid, sig);
            if (rv != SUCCESS) return 30;
            if (sid.empty()) return 31;
            if (is_p1 && sig.empty()) return 32;
            if (!is_p1 && !sig.empty()) return 33;
            return 0;
          }

          }  // namespace

          TEST(ApiEcdsa2pc, IndependentProcessPeerIdentityVerdictV23) {
            int p12[2], p21[2];
            ASSERT_EQ(::pipe(p12), 0);
            ASSERT_EQ(::pipe(p21), 0);

            pid_t p1 = ::fork();
            ASSERT_NE(p1, -1);
            if (p1 == 0) {
              ::close(p12[0]);
              ::close(p21[1]);
              int rc = v23_party(true, p21[0], p12[1]);
              ::close(p21[0]);
              ::close(p12[1]);
              _exit(rc);
            }

            pid_t p2 = ::fork();
            ASSERT_NE(p2, -1);
            if (p2 == 0) {
              ::close(p12[1]);
              ::close(p21[0]);
              int rc = v23_party(false, p12[0], p21[1]);
              ::close(p12[0]);
              ::close(p21[1]);
              _exit(rc);
            }

            ::close(p12[0]); ::close(p12[1]);
            ::close(p21[0]); ::close(p21[1]);

            int s1 = 0, s2 = 0;
            ASSERT_EQ(::waitpid(p1, &s1, 0), p1);
            ASSERT_EQ(::waitpid(p2, &s2, 0), p2);
            const int e1 = WIFEXITED(s1) ? WEXITSTATUS(s1) : 255;
            const int e2 = WIFEXITED(s2) ? WEXITSTATUS(s2) : 255;
            const int success = (e1 == 0 && e2 == 0) ? 1 : 0;

            std::ofstream out("/code/v23-verdict.txt", std::ios::trunc);
            out << "commit=fdbb60346757271d5e0241f417e55dc8f289573c"
                << " p1_exit=" << e1 << " p2_exit=" << e2
                << " independent_process_sign_success=" << success << "\n";
          }
          CPP

      - name: Build and run two-process test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEcdsa2pc.IndependentProcessPeerIdentityVerdictV23' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v23-verdict.txt ]; then cat v23-verdict.txt; else echo 'verdict_missing=1'; fi
          if [ "$status" -ne 0 ]; then
            echo 'V23_SANITIZER_OR_TEST_FAILURE=1'
            tail -n 80 /tmp/sanitize.log
            exit 1
          fi
          ok=$(sed -n 's/.*independent_process_sign_success=\([0-9][0-9]*\).*/\1/p' v23-verdict.txt)
          if [ "${ok:-0}" -gt 0 ]; then
            echo 'INDEPENDENT_PROCESS_PEER_IDENTITY_CANDIDATE=1'
            exit 2
          fi
          echo 'INDEPENDENT_PROCESS_PEER_IDENTITY_CANDIDATE=0'
