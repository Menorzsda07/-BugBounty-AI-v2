name: CBMPC PVE Quorum Relabel V43

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-pve-quorum-relabel-v43.yml'
      - 'pocs/cbmpc_pve_quorum_relabel_v43.cpp'
      - 'pocs/cbmpc_pve_quorum_relabel_v43_CMakeLists.txt'

permissions:
  contents: read

jobs:
  pve-quorum-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch PoC and exact cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Menorzsda07/-BugBounty-AI-v2.git audit >/dev/null 2>&1
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"
          cd ..
          mkdir -p cb-mpc/poc-v43
          cp audit/pocs/cbmpc_pve_quorum_relabel_v43.cpp cb-mpc/poc-v43/
          cp audit/pocs/cbmpc_pve_quorum_relabel_v43_CMakeLists.txt cb-mpc/poc-v43/CMakeLists.txt
          if grep -q 'include-internal\|cbmpc/internal' cb-mpc/poc-v43/cbmpc_pve_quorum_relabel_v43.cpp; then
            echo 'V43_PUBLIC_ONLY_SOURCE_CHECK=0'
            exit 1
          fi
          echo 'V43_PUBLIC_ONLY_SOURCE_CHECK=1'

      - name: Build cb-mpc image
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/v43-image.log 2>&1

      - name: Build public SDK and run probe
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          timeout 45m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc '
            set -euo pipefail
            cd /code
            make install BUILD_TYPE=Release >/tmp/v43-build.log 2>&1
            test -d /code/build/install/public/include/cbmpc/api
            test ! -d /code/build/install/public/include/cbmpc/internal
            cmake -S /code/poc-v43 -B /code/build/poc-v43 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCBMPC_REPO_ROOT=/code \
              -DCBMPC_SOURCE_DIR=/code/build/install/public
            cmake --build /code/build/poc-v43 -- -j2
            /code/build/poc-v43/cbmpc-pve-quorum-v43 | tee /code/v43-verdict.txt
          '
          cat v43-verdict.txt
          if grep -q 'V43_PVE_THRESHOLD_BYPASS_CANDIDATE=1' v43-verdict.txt; then
            echo 'V43_RESULT=CANDIDATE_CONFIRMED'
            exit 3
          fi
          grep -q 'V43_PVE_THRESHOLD_BYPASS_CANDIDATE=0' v43-verdict.txt
          echo 'V43_RESULT=NO_THRESHOLD_BYPASS'
