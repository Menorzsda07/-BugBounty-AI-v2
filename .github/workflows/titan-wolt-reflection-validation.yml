name: TITAN V PRO Wolt Reflection Validation

on:
  push:
    paths:
      - 'bugbounty_runner/bridge/wolt-reflection-validation-command.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate merchant reflection context without script execution
        run: python bugbounty_runner/validate_wolt_reflection.py
      - uses: actions/upload-artifact@v4
        with:
          name: titan-wolt-reflection-validation
          path: wolt-reflection-validation.json
          retention-days: 2
