name: CBMPC Public Only Standalone PoC V42

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-public-only-standalone-poc-v42.yml'
      - 'pocs/cbmpc_eddsa_2of3_alias_public_poc.cpp'
      - 'pocs/cbmpc_eddsa_2of3_alias_public_CMakeLists.txt'

permissions:
  contents: read

jobs:
  public-only-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch PoC and exact cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Menorzsda07/-BugBounty-AI-v2.git audit >/dev/null 2>&1
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"
          cd ..
          mkdir -p cb-mpc/poc-public
          cp audit/pocs/cbmpc_eddsa_2of3_alias_public_poc.cpp cb-mpc/poc-public/
          cp audit/pocs/cbmpc_eddsa_2of3_alias_public_CMakeLists.txt cb-mpc/poc-public/CMakeLists.txt
          echo 'PoC includes:'
          grep '^#include' cb-mpc/poc-public/cbmpc_eddsa_2of3_alias_public_poc.cpp
          if grep -q 'include-internal\|cbmpc/internal' cb-mpc/poc-public/cbmpc_eddsa_2of3_alias_public_poc.cpp; then
            echo 'PUBLIC_ONLY_SOURCE_CHECK=0'
            exit 1
          fi
          echo 'PUBLIC_ONLY_SOURCE_CHECK=1'

      - name: Build cb-mpc image
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1

      - name: Install public SDK, compile standalone PoC, and execute
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          set +e
          timeout 45m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc '
            set -euo pipefail
            cd /code
            make install BUILD_TYPE=Release >/tmp/public-install.log 2>&1
            test -d /code/build/install/public/include/cbmpc/api
            if [ -d /code/build/install/public/include/cbmpc/internal ]; then
              echo "PUBLIC_INSTALL_CONTAINS_INTERNAL_HEADERS=1"
              exit 7
            fi
            echo "PUBLIC_INSTALL_CONTAINS_INTERNAL_HEADERS=0"
            cmake -S /code/poc-public -B /code/build/public-only-poc \
              -DCMAKE_BUILD_TYPE=Release \
              -DCBMPC_REPO_ROOT=/code \
              -DCBMPC_SOURCE_DIR=/code/build/install/public >/tmp/poc-cmake.log 2>&1
            cmake --build /code/build/public-only-poc -- -j2 >/tmp/poc-build.log 2>&1
            /code/build/public-only-poc/cbmpc-public-alias-poc | tee /code/v42-verdict.txt
          ' >/tmp/v42.log 2>&1
          status=$?
          set -e
          echo "standalone_exit=$status"
          cat /tmp/v42.log
          if [ -f v42-verdict.txt ]; then cat v42-verdict.txt; fi
          if grep -q 'PUBLIC_ONLY_EDDSA_2OF3_UNAUTHORIZED_SIGNATURE_CONFIRMED=1' /tmp/v42.log; then
            echo 'V42_PUBLIC_ONLY_STANDALONE_CONFIRMED=1'
            exit 0
          fi
          echo 'V42_PUBLIC_ONLY_STANDALONE_CONFIRMED=0'
          if [ "$status" -ne 0 ]; then
            echo '--- install tail ---'
            tail -n 80 /tmp/public-install.log 2>/dev/null || true
            echo '--- cmake tail ---'
            tail -n 80 /tmp/poc-cmake.log 2>/dev/null || true
            echo '--- build tail ---'
            tail -n 120 /tmp/poc-build.log 2>/dev/null || true
          fi
          exit 1
