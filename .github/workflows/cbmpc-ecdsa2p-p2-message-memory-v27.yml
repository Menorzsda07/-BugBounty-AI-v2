name: CBMPC ECDSA2P P2 Message Memory V27

on:
  push:
    paths:
      - '.github/workflows/cbmpc-ecdsa2p-p2-message-memory-v27.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone current cb-mpc HEAD
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add P2-to-P1 structured mutation test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_ecdsa2pc.cpp <<'CPP'

          #include <atomic>
          #include <fstream>

          namespace {

          struct v27_state_t {
            std::atomic<bool> enabled{false};
            std::atomic<int> p2_sends{0};
            std::atomic<bool> applied{false};
            int target=-1;
            int mode=0;
          };

          class v27_transport_t final : public coinbase::api::data_transport_i {
           public:
            v27_transport_t(int self, std::shared_ptr<mpc_net_context_t> ctx, std::shared_ptr<v27_state_t> st)
              : self_(self), ctx_(std::move(ctx)), st_(std::move(st)) {}

            coinbase::error_t send(coinbase::api::party_idx_t receiver, coinbase::mem_t msg) override {
              if(st_->enabled.load() && self_==1 && receiver==0) {
                const int idx=st_->p2_sends.fetch_add(1);
                if(idx==st_->target) {
                  coinbase::buf_t b(msg);
                  switch(st_->mode) {
                    case 0: b.free(); break;
                    case 1: if(b.size()>0) b.resize(b.size()-1); break;
                    case 2: if(b.size()>1) b.resize(b.size()/2); break;
                    case 3: if(b.size()>0) b[0]^=0x80; break;
                    case 4: if(b.size()>0) b[b.size()-1]^=0x80; break;
                    case 5: {
                      const int old=b.size();
                      b.resize(old+64);
                      for(int i=old;i<b.size();++i) b[i]=(uint8_t)(0xA5 ^ i);
                      break;
                    }
                  }
                  st_->applied.store(true);
                  ctx_->send(receiver,b);
                  return SUCCESS;
                }
              }
              ctx_->send(receiver,msg);
              return SUCCESS;
            }

            coinbase::error_t receive(coinbase::api::party_idx_t sender, coinbase::buf_t& msg) override {
              return ctx_->receive(sender,msg);
            }
            coinbase::error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,
                                          std::vector<coinbase::buf_t>& msgs) override {
              std::vector<coinbase::mpc::party_idx_t> s;
              for(auto x:senders) s.push_back(static_cast<coinbase::mpc::party_idx_t>(x));
              return ctx_->receive_all(s,msgs);
            }
           private:
            int self_;
            std::shared_ptr<mpc_net_context_t> ctx_;
            std::shared_ptr<v27_state_t> st_;
          };

          } // namespace

          TEST(ApiEcdsa2pc, P2MessageMemoryVerdictV27) {
            auto c1=std::make_shared<mpc_net_context_t>(0);
            auto c2=std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers={c1,c2};
            c1->init_with_peers(peers); c2->init_with_peers(peers);
            auto st=std::make_shared<v27_state_t>();
            v27_transport_t t1(0,c1,st),t2(1,c2,st);
            const coinbase::api::job_2p_t j1{party_t::p1,"alice","bob",t1};
            const coinbase::api::job_2p_t j2{party_t::p2,"alice","bob",t2};

            error_t d1=UNINITIALIZED_ERROR,d2=UNINITIALIZED_ERROR;
            buf_t k1,k2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::ecdsa_2p::dkg(j1,curve_id::secp256k1,k1);},
              [&]{return coinbase::api::ecdsa_2p::dkg(j2,curve_id::secp256k1,k2);},d1,d2);
            ASSERT_EQ(d1,SUCCESS); ASSERT_EQ(d2,SUCCESS);

            // Baseline signing run counts P2->P1 protocol sends.
            st->enabled.store(true); st->target=-1; st->p2_sends.store(0); st->applied.store(false);
            buf_t h(32); for(int i=0;i<h.size();++i) h[i]=(uint8_t)(0x31+i);
            buf_t sid1,sid2,sig1,sig2;
            error_t s1=UNINITIALIZED_ERROR,s2=UNINITIALIZED_ERROR;
            run_2pc(c1,c2,
              [&]{return coinbase::api::ecdsa_2p::sign(j1,k1,h,sid1,sig1);},
              [&]{return coinbase::api::ecdsa_2p::sign(j2,k2,h,sid2,sig2);},s1,s2);
            ASSERT_EQ(s1,SUCCESS); ASSERT_EQ(s2,SUCCESS); ASSERT_FALSE(sig1.empty());
            const int sends=st->p2_sends.load();

            int cases=0, mutated_success=0, applied_cases=0;
            for(int target=0; target<sends; ++target) {
              for(int mode=0; mode<6; ++mode) {
                st->target=target; st->mode=mode; st->p2_sends.store(0); st->applied.store(false);
                buf_t msid1,msid2,msig1,msig2;
                error_t m1=UNINITIALIZED_ERROR,m2=UNINITIALIZED_ERROR;
                run_2pc(c1,c2,
                  [&]{return coinbase::api::ecdsa_2p::sign(j1,k1,h,msid1,msig1);},
                  [&]{return coinbase::api::ecdsa_2p::sign(j2,k2,h,msid2,msig2);},m1,m2);
                ++cases;
                if(st->applied.load()) ++applied_cases;
                if(st->applied.load() && m1==SUCCESS && m2==SUCCESS && !msig1.empty()) ++mutated_success;
              }
            }

            std::ofstream out("/code/v27-verdict.txt",std::ios::trunc);
            out<<"p2_send_count="<<sends<<" cases="<<cases<<" applied_cases="<<applied_cases
               <<" mutated_success="<<mutated_success<<"\n";
          }
          CPP

      - name: Build and run ASAN UBSAN remote-message mutation campaign
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEcdsa2pc.P2MessageMemoryVerdictV27' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v27-verdict.txt ]; then cat v27-verdict.txt; else echo 'verdict_missing=1'; fi
          if [ "$status" -ne 0 ]; then
            echo 'ECDSA2P_REMOTE_MESSAGE_MEMORY_CANDIDATE=1'
            tail -n 100 /tmp/sanitize.log
            exit 2
          fi
          echo 'ECDSA2P_REMOTE_MESSAGE_MEMORY_CANDIDATE=0'
