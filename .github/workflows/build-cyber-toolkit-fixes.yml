name: Build Cyber Toolkit Fixes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cyber-toolkit-fixes.yml'

permissions:
  contents: read

jobs:
  fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build fixes bundle
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/cyber-fixes"
          mkdir -p "$ROOT/tools" "$ROOT/pydeps" "$ROOT/bin" "$ROOT/patterns"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bsdextrautils git python3-pip ca-certificates

          git clone --depth 1 https://github.com/sullo/nikto.git "$ROOT/tools/nikto"
          git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git "$ROOT/nuclei-templates"
          git clone --depth 1 https://github.com/tomnomnom/gf.git "$ROOT/tools/gf-src"
          if [ -d "$ROOT/tools/gf-src/examples" ]; then cp -a "$ROOT/tools/gf-src/examples/." "$ROOT/patterns/"; fi

          python3 -m pip install --break-system-packages --target "$ROOT/pydeps" dicttoxml ratelimit
          cp -L "$(command -v hexdump)" "$ROOT/bin/hexdump"
          chmod +x "$ROOT/bin/hexdump"
          find "$ROOT" -type d -name .git -prune -exec rm -rf {} +
          tar -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/cyber-fixes-linux-amd64.tar.gz" cyber-fixes

      - name: Upload fixes artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-fixes-linux-amd64
          path: cyber-fixes-linux-amd64.tar.gz
          retention-days: 1
          compression-level: 0
