name: CBMPC EdDSA AC Policy Substitution V55
on:
  push:
    paths:
      - 'pocs/cbmpc_eddsa_ac_policy_substitution_v55.cpp'
      - 'pocs/cbmpc_eddsa_ac_policy_substitution_v55_CMakeLists.txt'
      - '.github/workflows/cbmpc-eddsa-ac-policy-substitution-v55.yml'
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch PoC and exact upstream
        run: |
          set -euo pipefail
          git clone https://github.com/Menorzsda07/-BugBounty-AI-v2.git audit >/dev/null 2>&1
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"
          cd ..
          mkdir -p cb-mpc/poc-v55
          cp audit/pocs/cbmpc_eddsa_ac_policy_substitution_v55.cpp cb-mpc/poc-v55/
          cp audit/pocs/cbmpc_eddsa_ac_policy_substitution_v55_CMakeLists.txt cb-mpc/poc-v55/CMakeLists.txt
          if grep -q 'include-internal\|cbmpc/internal' cb-mpc/poc-v55/cbmpc_eddsa_ac_policy_substitution_v55.cpp; then exit 1; fi
          echo V55_PUBLIC_ONLY_SOURCE_CHECK=1
      - name: Build image
        run: cd cb-mpc && make image >/tmp/v55-image.log 2>&1
      - name: Build public SDK and run policy probe
        run: |
          set -euo pipefail
          cd cb-mpc
          set +e
          timeout 45m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc '
            set -euo pipefail
            cd /code
            make install BUILD_TYPE=Release >/tmp/v55-build.log 2>&1
            test ! -d /code/build/install/public/include/cbmpc/internal
            cmake -S /code/poc-v55 -B /code/build/poc-v55 -DCMAKE_BUILD_TYPE=Release -DCBMPC_REPO_ROOT=/code -DCBMPC_SOURCE_DIR=/code/build/install/public
            cmake --build /code/build/poc-v55 -- -j2
            /code/build/poc-v55/cbmpc-eddsa-ac-policy-v55 | tee /code/v55-verdict.txt
          ' > /tmp/v55.log 2>&1
          status=$?
          set -e
          cat /tmp/v55.log
          if grep -q 'V55_THRESHOLD_BYPASS_CANDIDATE=1' /tmp/v55.log; then echo V55_THRESHOLD_BYPASS_CONFIRMED=1; exit 3; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          grep -q 'V55_THRESHOLD_BYPASS_CANDIDATE=0' /tmp/v55.log
          echo V55_THRESHOLD_BYPASS_CONFIRMED=0
