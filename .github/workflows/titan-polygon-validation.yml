name: TITAN Polygon Candidate Validation
on:
  push:
    paths:
      - 'bugbounty_runner/bridge/validate-command.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate current Polygon candidates
        run: python bugbounty_runner/validate_polygon_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-polygon-validation
          path: validation-results/
          retention-days: 2
