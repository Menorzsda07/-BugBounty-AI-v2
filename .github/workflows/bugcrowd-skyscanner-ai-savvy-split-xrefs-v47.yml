name: Bugcrowd Skyscanner AI Savvy Split Xrefs V47

on:
  push:
    paths:
      - '.github/workflows/bugcrowd-skyscanner-ai-savvy-split-xrefs-v47.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-savvy-split-xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Inventory APK splits and trace AI Savvy references
        shell: bash
        run: |
          set -euo pipefail
          echo 'SCOPE_CHECK_DATE=2026-08-15'
          echo 'STATIC_ANALYSIS_ONLY=1'
          echo 'LIVE_SKYSCANNER_REQUESTS=0'
          mkdir -p "$PWD/out" "$PWD/unpacked" "$PWD/jadx" "$PWD/decompiled"

          docker run --rm -v "$PWD/out:/output" ghcr.io/efforg/apkeep:stable \
            -a net.skyscanner.android.main /output
          FILE=$(find out -maxdepth 1 -type f | head -n1)
          test -n "$FILE"
          echo "ARCHIVE_FILE=$(basename "$FILE")"
          echo "ARCHIVE_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)"
          unzip -q "$FILE" -d unpacked

          count=$(find unpacked -type f -name '*.apk' | wc -l)
          echo "V47_APK_COUNT=$count"
          test "$count" -gt 0
          find unpacked -type f -name '*.apk' -print | sort | while IFS= read -r apk; do
            echo "APK file=$(basename "$apk") bytes=$(stat -c%s "$apk") sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile

          terms = [b"savvy", b"ai_search", b"ai-search", b"ai search",
                   b"openai", b"prompt", b"recommendation",
                   b"destination suggestion"]
          secretish = re.compile(
              rb"(?i)(api[_-]?key|authorization|client[_-]?secret|access[_-]?token)"
              rb"(.{0,12})[A-Za-z0-9_+/=.-]{20,}"
          )
          longish = re.compile(rb"[A-Za-z0-9_+/=.-]{48,}")
          total = 0
          print("V47_RAW_SPLIT_HITS=")
          for apk in sorted(Path("unpacked").rglob("*.apk")):
              with zipfile.ZipFile(apk) as zf:
                  for info in zf.infolist():
                      if info.file_size > 160_000_000:
                          continue
                      name = info.filename
                      if not (name.endswith((".dex", ".arsc", ".xml", ".json", ".txt"))
                              or name.startswith("assets/")):
                          continue
                      try:
                          data = zf.read(info)
                      except Exception:
                          continue
                      lower = data.lower()
                      compact = lower.replace(b"\x00", b"")
                      hits = [t for t in terms if t in lower or t in compact]
                      if not hits:
                          continue
                      print(f"RAW apk={apk.name} entry={name} terms={[t.decode() for t in hits]} bytes={len(data)}")
                      for term in hits:
                          pos, source = lower.find(term), data
                          if pos < 0:
                              pos, source = compact.find(term), compact
                          snippet = source[max(0, pos-90):pos+210]
                          snippet = secretish.sub(rb"\1\2<redacted>", snippet)
                          snippet = longish.sub(b"<long-literal-redacted>", snippet)
                          safe = "".join(chr(b) if 32 <= b < 127 else " " for b in snippet)
                          print(f"RAW_SNIPPET term={term.decode()} value={safe[:360]}")
                          total += 1
                          if total >= 160:
                              break
                      if total >= 160:
                          break
              if total >= 160:
                  break
          print(f"V47_RAW_SNIPPET_COUNT={total}")
          PY

          curl -fsSL --retry 2 --max-time 60 -o /tmp/jadx.zip \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'
          unzip -q /tmp/jadx.zip -d jadx
          chmod +x jadx/bin/jadx

          set +e
          find unpacked -type f -name '*.apk' -print0 | \
            xargs -0 jadx/bin/jadx --no-debug-info --show-bad-code --deobf \
              --threads-count 2 -d decompiled >/tmp/jadx.log 2>&1
          rc=$?
          set -e
          echo "JADX_RC=$rc"
          tail -n 30 /tmp/jadx.log || true

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path("decompiled")
          exact = [
              re.compile(r"SAVVY_SEARCH_TAPPED", re.I),
              re.compile(r"\bAI_SEARCH\b", re.I),
              re.compile(r"SavvySearch", re.I),
              re.compile(r"savvy[_ -]?search", re.I),
              re.compile(r"ai[_ -]?search", re.I),
              re.compile(r"\bOpenAI\b", re.I),
          ]
          supporting = [
              re.compile(r"\bprompt\b", re.I),
              re.compile(r"\brecommend(?:ation|ations|ed|ing)?\b", re.I),
              re.compile(r"\bdestination(?:s)?\b", re.I),
              re.compile(r"\bconversation(?:al|s)?\b", re.I),
          ]
          suffixes = {".java", ".xml", ".json", ".txt", ".properties", ".html"}
          matches = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(errors="replace")
              except OSError:
                  continue
              eh = [rx.pattern for rx in exact if rx.search(text)]
              sh = [rx.pattern for rx in supporting if rx.search(text)]
              if eh or len(sh) >= 3:
                  matches.append((100*len(eh)+10*len(sh), path.relative_to(root).as_posix(), eh, sh, text))

          matches.sort(key=lambda x: (-x[0], x[1]))
          print(f"V47_XREF_FILES={len(matches)}")
          for score, rel, eh, sh, _ in matches[:160]:
              print(f"XREF_INDEX score={score} file={rel} exact={eh} supporting={sh}")

          long_lit = re.compile(r"(?<![A-Za-z0-9])[A-Za-z0-9_+/=.-]{48,}(?![A-Za-z0-9])")
          secret = re.compile(
              r"(?i)((?:api[_-]?key|authorization|client[_-]?secret|access[_-]?token|refresh[_-]?token)"
              r"\s*[:=]\s*[\"']?)[^\"'\s,;}]+"
          )
          url_rx = re.compile(r"https?://[^\s\"'<>]+")
          http_rx = re.compile(r"@(GET|POST|PUT|PATCH|DELETE)\(\s*[\"']([^\"']+)[\"']\s*\)")

          def clean_url(value):
              try:
                  u = urlsplit(value.rstrip(").,;"))
                  return f"{u.scheme}://{u.netloc}{u.path[:260]}"
              except Exception:
                  return "<url-redacted>"

          def safe(line):
              line = secret.sub(r"\1<redacted>", line)
              line = long_lit.sub("<long-literal-redacted>", line)
              line = url_rx.sub(lambda m: clean_url(m.group(0)), line)
              return line[:850]

          emitted, urls, methods = 0, set(), set()
          print("V47_XREF_WINDOWS=")
          for score, rel, eh, sh, text in matches[:120]:
              lines = text.splitlines()
              indexes = [i for i, line in enumerate(lines) if any(rx.search(line) for rx in exact)]
              if not indexes:
                  continue
              print(f"XREF_FILE={rel} SCORE={score} MATCH_LINES={len(indexes)}")
              shown = set()
              for i in indexes:
                  for j in range(max(0, i-4), min(len(lines), i+5)):
                      if j in shown:
                          continue
                      shown.add(j)
                      print(f"{j+1}: {safe(lines[j])}")
                      emitted += 1
                      if emitted >= 1400:
                          break
                  if emitted >= 1400:
                      break
              for m in url_rx.finditer(text):
                  urls.add((rel, clean_url(m.group(0))))
              for method, route in http_rx.findall(text):
                  methods.add((rel, method.upper(), route.split("?")[0][:260]))
              if emitted >= 1400:
                  break

          print(f"V47_XREF_SNIPPET_LINES={emitted}")
          print(f"V47_XREF_URL_COUNT={len(urls)}")
          for rel, value in sorted(urls)[:220]:
              print(f"XREF_URL file={rel} value={value}")
          print(f"V47_XREF_HTTP_COUNT={len(methods)}")
          for rel, method, route in sorted(methods)[:220]:
              print(f"XREF_HTTP file={rel} method={method} route={route}")
          print("V47_AI_SAVVY_SPLIT_XREF_DONE=1")
          PY
