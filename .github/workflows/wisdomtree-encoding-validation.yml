name: TITAN WisdomTree encoding differential validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'bugbounty_runner/bridge/wisdomtree-validation-command.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install requests
      - name: Rigorous low-impact differential validation
        shell: bash
        run: |
          mkdir -p validation
          python - <<'PY'
          import json, re, time, hashlib, statistics, difflib, itertools, urllib.parse
          from html import unescape
          import requests

          CMD='bugbounty_runner/bridge/wisdomtree-validation-command.json'
          if __import__('os').path.exists(CMD):
              cmd=json.load(open(CMD, encoding='utf-8'))
          else:
              cmd={
                  'target':'https://app.wisdomtreeconnect.com/api/',
                  'rounds':4,
                  'delay_ms':1000,
                  'max_requests':16,
              }

          TARGET=cmd.get('target')
          ROUNDS=int(cmd.get('rounds',4))
          DELAY=max(750,int(cmd.get('delay_ms',1000)))/1000
          MAX_REQUESTS=int(cmd.get('max_requests',16))
          ALLOWED={'https://app.wisdomtreeconnect.com/api/'}
          assert TARGET in ALLOWED, f'out-of-scope target blocked: {TARGET}'
          assert 2 <= ROUNDS <= 5
          assert MAX_REQUESTS <= 20

          # Four benign controls, four rounds each = 16 requests total.
          # literal and encoded are logically equivalent; distinct is a negative control.
          variants={
              'baseline':'',
              'literal':'?q=A',
              'encoded':'?q=%41',
              'distinct':'?q=B',
          }
          planned=len(variants)*ROUNDS
          assert planned <= MAX_REQUESTS

          UA='BugBounty-AI/3.1 WisdomTree encoding-validation low-volume'
          headers={'User-Agent':UA, 'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'}

          def sha(b): return hashlib.sha256(b).hexdigest()

          def normalize_text(text):
              s=text
              # Mask common volatile response values without erasing semantic HTML structure.
              s=re.sub(r'(?i)(csrfmiddlewaretoken["\'\s:=]+)[A-Za-z0-9_-]{16,}', r'\1<VOLATILE>', s)
              s=re.sub(r'(?i)(nonce=["\'])[A-Za-z0-9_+/=-]{8,}(["\'])', r'\1<VOLATILE>\2', s)
              s=re.sub(r'(?i)(ray id:?[\s<]*)([0-9a-f]{12,})', r'\1<VOLATILE>', s)
              s=re.sub(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b','<UUID>',s)
              s=re.sub(r'\b20\d\d-[01]\d-[0-3]\d[T ][0-2]\d:[0-5]\d:[0-5]\d(?:\.\d+)?Z?\b','<TIMESTAMP>',s)
              return s

          def structure(text):
              title=re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S)
              scripts=sorted(set(unescape(x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)))
              links=sorted(set(unescape(x) for x in re.findall(r'<link[^>]+href=["\']([^"\']+)', text, re.I)))
              forms=sorted(set(unescape(x) for x in re.findall(r'<form[^>]+action=["\']([^"\']*)', text, re.I)))
              return {
                  'title': re.sub(r'\s+',' ',title.group(1)).strip() if title else '',
                  'scripts': scripts,
                  'links': links,
                  'forms': forms,
                  'tag_counts': {t:len(re.findall(fr'<{t}\b',text,re.I)) for t in ('html','body','div','script','link','form','input')},
              }

          def similarity(a,b):
              return difflib.SequenceMatcher(None,a,b,autojunk=False).ratio()

          def diff_excerpt(a,b,limit=8):
              al=a.splitlines(); bl=b.splitlines(); out=[]
              for line in difflib.unified_diff(al,bl,fromfile='a',tofile='b',n=1):
                  if line.startswith(('---','+++','@@')): continue
                  if line.startswith(('+','-')):
                      out.append(line[:500])
                      if len(out)>=limit: break
              return out

          samples={k:[] for k in variants}
          request_count=0
          for round_no in range(ROUNDS):
              for name,suffix in variants.items():
                  url=TARGET+suffix
                  started=time.time()
                  try:
                      r=requests.get(url,headers=headers,timeout=15,allow_redirects=False)
                      body=r.content
                      text=r.text
                      norm=normalize_text(text)
                      item={
                          'round':round_no+1,
                          'url':url,
                          'status':r.status_code,
                          'bytes':len(body),
                          'ctype':r.headers.get('content-type',''),
                          'location':r.headers.get('location',''),
                          'server':r.headers.get('server',''),
                          'cf_ray':r.headers.get('cf-ray',''),
                          'cf_cache_status':r.headers.get('cf-cache-status',''),
                          'cache_control':r.headers.get('cache-control',''),
                          'etag':r.headers.get('etag',''),
                          'vary':r.headers.get('vary',''),
                          'elapsed_ms':round((time.time()-started)*1000,1),
                          'raw_sha256':sha(body),
                          'normalized_sha256':sha(norm.encode('utf-8','replace')),
                          'structure':structure(text),
                          'query_reflections':{
                              '?q=A':'?q=A' in text,
                              '?q=%41':'?q=%41' in text,
                              'q=A':'q=A' in text,
                              'q=%41':'q=%41' in text,
                          },
                          '_text':text,
                          '_norm':norm,
                      }
                  except Exception as e:
                      item={'round':round_no+1,'url':url,'error':repr(e),'_text':'','_norm':''}
                  samples[name].append(item)
                  request_count+=1
                  time.sleep(DELAY)

          def public_item(x): return {k:v for k,v in x.items() if not k.startswith('_')}
          def valid(group): return [x for x in samples[group] if 'error' not in x]

          def intra_similarity(group):
              xs=valid(group)
              vals=[similarity(a['_norm'],b['_norm']) for a,b in itertools.combinations(xs,2)]
              return statistics.median(vals) if vals else 1.0

          lit=valid('literal'); enc=valid('encoded'); dist=valid('distinct'); base=valid('baseline')
          cross=[similarity(a['_norm'],b['_norm']) for a,b in zip(lit,enc)]
          cross_dist=[similarity(a['_norm'],b['_norm']) for a,b in zip(lit,dist)]
          cross_med=statistics.median(cross) if cross else 0.0
          dist_med=statistics.median(cross_dist) if cross_dist else 0.0
          intra_lit=intra_similarity('literal'); intra_enc=intra_similarity('encoded')
          intra_floor=min(intra_lit,intra_enc)

          same_status=bool(lit and enc) and all(a['status']==b['status'] for a,b in zip(lit,enc))
          same_ctype=bool(lit and enc) and all(a['ctype']==b['ctype'] for a,b in zip(lit,enc))
          same_length=bool(lit and enc) and all(a['bytes']==b['bytes'] for a,b in zip(lit,enc))
          structures_equal=bool(lit and enc) and all(a['structure']==b['structure'] for a,b in zip(lit,enc))
          raw_unique={g:len({x.get('raw_sha256') for x in valid(g)}) for g in variants}
          norm_unique={g:len({x.get('normalized_sha256') for x in valid(g)}) for g in variants}

          stable_within=(intra_floor >= 0.99999)
          material_cross=(cross_med < 0.995 and (intra_floor-cross_med) > 0.002)
          equivalent_after_normalization=(cross_med >= 0.99999 and structures_equal and same_status and same_ctype)

          if equivalent_after_normalization:
              verdict='false_positive_dynamic_or_nonsemantic_response_variance'
              security_relevance='none_observed'
          elif stable_within and material_cross:
              verdict='persistent_encoding_differential_candidate'
              security_relevance='requires_manual_semantic_review'
          elif cross_med >= intra_floor-0.0005 and same_status and same_ctype and structures_equal:
              verdict='false_positive_variance_not_correlated_with_encoding'
              security_relevance='none_observed'
          else:
              verdict='inconclusive_low_signal_encoding_difference'
              security_relevance='not_confirmed'

          result={
              'target':TARGET,
              'scope_gate':'exact allowlist passed',
              'requests_made':request_count,
              'rounds':ROUNDS,
              'verdict':verdict,
              'security_relevance':security_relevance,
              'metrics':{
                  'same_status_each_round':same_status,
                  'same_content_type_each_round':same_ctype,
                  'same_length_each_round':same_length,
                  'same_structure_each_round':structures_equal,
                  'literal_intra_normalized_similarity_median':intra_lit,
                  'encoded_intra_normalized_similarity_median':intra_enc,
                  'literal_vs_encoded_normalized_similarity_median':cross_med,
                  'literal_vs_distinct_normalized_similarity_median':dist_med,
                  'raw_unique_hashes':raw_unique,
                  'normalized_unique_hashes':norm_unique,
              },
              'samples':{g:[public_item(x) for x in samples[g]] for g in variants},
              'diff_excerpts':{
                  'literal_vs_encoded_round1':diff_excerpt(lit[0]['_norm'],enc[0]['_norm']) if lit and enc else [],
                  'literal_repeat_round1_vs_round2':diff_excerpt(lit[0]['_norm'],lit[1]['_norm']) if len(lit)>1 else [],
                  'encoded_repeat_round1_vs_round2':diff_excerpt(enc[0]['_norm'],enc[1]['_norm']) if len(enc)>1 else [],
              },
              'reasoning':[
                  'Equivalent q=A and q=%41 are compared across repeated rounds.',
                  'Repeated identical requests establish natural response variance before attributing differences to encoding.',
                  'A q=B negative control measures whether the query value materially influences the public 404 response.',
                  'No authentication, state-changing method, data modification, privilege escalation, or destructive action is used.',
              ],
          }
          json.dump(result,open('validation/wisdomtree-encoding-validation.json','w'),indent=2)
          with open('validation/summary.txt','w') as f:
              f.write(f"Verdict: {verdict}\n")
              f.write(f"Security relevance: {security_relevance}\n")
              f.write(f"Requests: {request_count}\n")
              f.write(f"same_status={same_status} same_ctype={same_ctype} same_length={same_length} same_structure={structures_equal}\n")
              f.write(f"intra_literal={intra_lit:.8f} intra_encoded={intra_enc:.8f} cross_equivalent={cross_med:.8f} cross_distinct={dist_med:.8f}\n")
              f.write(f"raw_unique={raw_unique}\nnormalized_unique={norm_unique}\n")
          print(open('validation/summary.txt').read())
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisdomtree-encoding-validation
          path: validation/
          retention-days: 2
