name: CBMPC AC Cross Policy DKG V37

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-ac-cross-policy-dkg-v37.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
      - name: Add public cross-policy DKG tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_schnorr_mp_ac.cpp <<'CPP'

          #include <fstream>

          TEST(ApiSchnorrMpAc, CrossPartyPolicyBindingVerdictV37) {
            constexpr int n = 3;
            std::vector<std::string> names = {"p0","p1","p2"};
            std::vector<std::string_view> nv = {names[0],names[1],names[2]};
            const auto L = [&](int i) { return coinbase::api::access_structure_t::leaf(names[static_cast<size_t>(i)]); };
            const auto strong = coinbase::api::access_structure_t::Threshold(2, {L(0),L(1),L(2)});
            const auto weak = coinbase::api::access_structure_t::Or({L(0),L(1),L(2)});
            const auto asymmetric = coinbase::api::access_structure_t::Or({
                coinbase::api::access_structure_t::And({L(0),L(1)}), L(2)});
            const std::vector<std::string_view> full_quorum = {names[0],names[1],names[2]};

            std::vector<std::vector<coinbase::api::access_structure_t>> cases;
            cases.push_back({strong, strong, weak});
            cases.push_back({strong, asymmetric, strong});
            cases.push_back({weak, strong, asymmetric});

            int tested = 0, all_success = 0, same_public_key = 0, weak_single_sign = 0;
            for (size_t ci = 0; ci < cases.size(); ++ci) {
              ++tested;
              std::vector<std::shared_ptr<mpc_net_context_t>> peers;
              for (int i=0;i<n;++i) peers.push_back(std::make_shared<mpc_net_context_t>(i));
              for (const auto& p:peers) p->init_with_peers(peers);
              std::vector<std::shared_ptr<local_api_transport_t>> ts;
              for (const auto& p:peers) ts.push_back(std::make_shared<local_api_transport_t>(p));
              std::vector<buf_t> keys(n), sids(n);
              std::vector<error_t> rvs;
              run_mp(peers,[&](int i){
                job_mp_t job{static_cast<party_idx_t>(i),nv,*ts[static_cast<size_t>(i)]};
                return coinbase::api::schnorr_mp::dkg_ac(job,curve_id::secp256k1,sids[static_cast<size_t>(i)],
                    cases[ci][static_cast<size_t>(i)],full_quorum,keys[static_cast<size_t>(i)]);
              },rvs);
              bool ok=rvs.size()==n;
              for(auto rv:rvs) ok=ok&&(rv==SUCCESS);
              if(!ok) continue;
              ++all_success;
              buf_t p0,p1,p2;
              if(coinbase::api::schnorr_mp::get_public_key_compressed(keys[0],p0)!=SUCCESS ||
                 coinbase::api::schnorr_mp::get_public_key_compressed(keys[1],p1)!=SUCCESS ||
                 coinbase::api::schnorr_mp::get_public_key_compressed(keys[2],p2)!=SUCCESS) continue;
              if(p0==p1 && p1==p2) ++same_public_key;

              // If mixed-policy DKG somehow succeeds coherently, try the one-party weak view.
              failing_transport_t ft;
              std::vector<std::string_view> single={names[2]};
              job_mp_t job{/*self=*/0,single,ft};
              buf_t msg(32),sig;
              for(int i=0;i<32;++i) msg[i]=static_cast<uint8_t>(0x60+i);
              if(coinbase::api::schnorr_mp::sign_ac(job,keys[2],weak,msg,0,sig)==SUCCESS && !sig.empty())
                ++weak_single_sign;
            }
            std::ofstream out("/code/v37-verdict.txt",std::ios::trunc);
            out<<"commit=fdbb60346757271d5e0241f417e55dc8f289573c tested="<<tested
               <<" all_success="<<all_success<<" same_public_key="<<same_public_key
               <<" weak_single_sign="<<weak_single_sign<<"\n";
          }
          CPP
      - name: Run release cross-policy test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 42m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make test filter=ApiSchnorrMpAc.CrossPartyPolicyBindingVerdictV37' >/tmp/test.log 2>&1
          status=$?
          set -e
          echo "test_exit=$status"
          if [ -f v37-verdict.txt ]; then cat v37-verdict.txt; else echo verdict_missing=1; fi
          same=$(sed -n 's/.*same_public_key=\([0-9][0-9]*\).*/\1/p' v37-verdict.txt 2>/dev/null || true)
          if [ "${same:-0}" -gt 0 ]; then
            echo 'CROSS_POLICY_DKG_BINDING_CANDIDATE=1'
            exit 2
          fi
          if [ "$status" -ne 0 ]; then
            echo V37_TEST_OR_BUILD_FAILURE=1
            tail -n 140 /tmp/test.log
            exit 1
          fi
          echo CROSS_POLICY_DKG_BINDING_CANDIDATE=0
