name: CBMPC 2P Peer Name Binding V17

on:
  push:
    paths:
      - '.github/workflows/cbmpc-2p-peer-name-binding-v17.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone exact current cb-mpc
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout 2369813b8b0507ce20febd1d81ef1708cdbb42d7 >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1

      - name: Add peer-name binding test through public APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_hd_keyset_ecdsa_2p.cpp <<'CPP'

          #include <fstream>

          TEST(ApiHdKeysetEcdsa2p, PeerNameBindingVerdictV17) {
            using coinbase::buf_t;
            using coinbase::error_t;
            using coinbase::api::curve_id;
            using coinbase::api::ecdsa_2p::party_t;
            using coinbase::testutils::mpc_net_context_t;
            using coinbase::testutils::api_harness::local_api_transport_t;
            using coinbase::testutils::api_harness::run_2pc;

            auto c1=std::make_shared<mpc_net_context_t>(0);
            auto c2=std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers={c1,c2};
            c1->init_with_peers(peers);c2->init_with_peers(peers);
            local_api_transport_t t1(c1),t2(c2);

            const coinbase::api::job_2p_t setup1{party_t::p1,"alice","bob",t1};
            const coinbase::api::job_2p_t setup2{party_t::p2,"alice","bob",t2};
            error_t rv1=UNINITIALIZED_ERROR,rv2=UNINITIALIZED_ERROR;
            buf_t k1,k2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::dkg(setup1,curve_id::secp256k1,k1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::dkg(setup2,curve_id::secp256k1,k2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS);ASSERT_EQ(rv2,SUCCESS);

            // P1 believes its peer is bob. P2 runs the same protocol while naming itself mallory.
            // Both still address each other by the same transport indices 0/1.
            const coinbase::api::job_2p_t mism1{party_t::p1,"alice","bob",t1};
            const coinbase::api::job_2p_t mism2{party_t::p2,"alice","mallory",t2};

            coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t hard;
            hard.indices={0x8000002c,0x80000000,0x80000000};
            std::vector<coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t> nh;
            nh.push_back(coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t{{0,9}});
            buf_t sid1("v17-fixed-derive"),sid2("v17-fixed-derive");
            std::vector<buf_t> d1,d2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(mism1,k1,hard,nh,sid1,d1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(mism2,k2,hard,nh,sid2,d2);},rv1,rv2);

            int derive_success=(rv1==SUCCESS&&rv2==SUCCESS&&d1.size()==1&&d2.size()==1)?1:0;
            int pub_match=0, sign_success=0;
            error_t sr1=UNINITIALIZED_ERROR,sr2=UNINITIALIZED_ERROR;
            if(derive_success){
              buf_t p1,p2;
              if(coinbase::api::ecdsa_2p::get_public_key_compressed(d1[0],p1)==SUCCESS&&
                 coinbase::api::ecdsa_2p::get_public_key_compressed(d2[0],p2)==SUCCESS&&p1==p2)pub_match=1;
              buf_t h(32);for(int i=0;i<h.size();i++)h[i]=(uint8_t)(0x31+i);
              buf_t ss1("v17-fixed-sign"),ss2("v17-fixed-sign"),sig1,sig2;
              run_2pc(c1,c2,
                [&]{return coinbase::api::ecdsa_2p::sign(mism1,d1[0],h,ss1,sig1);},
                [&]{return coinbase::api::ecdsa_2p::sign(mism2,d2[0],h,ss2,sig2);},sr1,sr2);
              if(sr1==SUCCESS&&sr2==SUCCESS&&!sig1.empty())sign_success=1;
            }

            std::ofstream out("/code/v17-verdict.txt",std::ios::trunc);
            out<<"derive_rv="<<rv1<<","<<rv2<<" derive_success="<<derive_success
               <<" pub_match="<<pub_match<<" sign_rv="<<sr1<<","<<sr2
               <<" sign_success="<<sign_success<<"\n";
          }
          CPP

      - name: Build and run ASAN UBSAN peer-name binding test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiHdKeysetEcdsa2p.PeerNameBindingVerdictV17' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v17-verdict.txt ]; then cat v17-verdict.txt; else echo 'verdict_missing=1'; fi
          if [ "$status" -ne 0 ]; then
            echo 'V17_SANITIZER_OR_TEST_FAILURE=1'
            tail -n 60 /tmp/sanitize.log
            exit 1
          fi
          ok=$(sed -n 's/.*sign_success=\([0-9][0-9]*\).*/\1/p' v17-verdict.txt)
          if [ "${ok:-0}" -gt 0 ]; then
            echo 'PEER_NAME_BINDING_CANDIDATE=1'
            exit 2
          fi
          echo 'PEER_NAME_BINDING_CANDIDATE=0'
