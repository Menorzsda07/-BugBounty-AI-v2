name: CBMPC Targeted Inner Message V3

on:
  push:
    paths:
      - '.github/workflows/cbmpc-targeted-inner-message-v3.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone exact cb-mpc revision
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout 2369813b8b0507ce20febd1d81ef1708cdbb42d7 >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1

      - name: Remove test-only allocator mismatch in runner copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          s=p.read_text()
          s=s.replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());')
          p.write_text(s)
          PY

      - name: Add targeted inner-message test to runner copy
        shell: bash
        run: |
          cat >> cb-mpc/tests/unit/api/test_ecdsa_mp.cpp <<'CPP'

          #include <chrono>
          #include <fstream>
          #include <mutex>
          #include <cbmpc/internal/core/convert.h>

          namespace {

          struct inner_mut_state_t {
            std::atomic<bool> enabled{false};
            std::atomic<int> multi_seen{0};
            int attacker = 0;
            int target_multi = -1;
            int mode = 0;
            std::atomic<bool> mutation_applied{false};
            std::atomic<bool> timed_out{false};
            std::mutex mu;
            std::vector<std::string> exceptions;
            std::vector<std::string> envelope_notes;
          };

          class inner_mut_transport_t final : public coinbase::api::data_transport_i {
           public:
            inner_mut_transport_t(int self, std::shared_ptr<coinbase::testutils::mpc_net_context_t> ctx,
                                  std::shared_ptr<inner_mut_state_t> st)
                : self_(self), ctx_(std::move(ctx)), st_(std::move(st)) {}

            coinbase::error_t send(coinbase::api::party_idx_t receiver, coinbase::mem_t msg) override {
              if (st_->enabled.load() && self_ == st_->attacker && msg.size > 0) {
                coinbase::buf_t first, second;
                auto dr = coinbase::deser(msg, first, second);
                if (dr == SUCCESS) {
                  const int idx = st_->multi_seen.fetch_add(1);
                  {
                    std::lock_guard<std::mutex> lk(st_->mu);
                    st_->envelope_notes.push_back(std::to_string(idx)+":"+std::to_string(first.size())+":"+std::to_string(second.size()));
                  }
                  if (idx == st_->target_multi) {
                    coinbase::buf_t f(first), s(second);
                    switch (st_->mode) {
                      case 0: f.free(); break;
                      case 1: if (f.size()>1) f = coinbase::buf_t(f.take(f.size()-1)); break;
                      case 2: if (!f.empty()) f[f.size()-1] ^= 0x80; break;
                      case 3: s.free(); break;
                      case 4: if (s.size()>1) s = coinbase::buf_t(s.take(s.size()-1)); break;
                      case 5: if (!s.empty()) s[s.size()-1] ^= 0x80; break;
                    }
                    auto rebuilt = coinbase::ser(f, s);
                    st_->mutation_applied.store(true);
                    ctx_->send(receiver, rebuilt);
                    return SUCCESS;
                  }
                }
              }
              ctx_->send(receiver, msg);
              return SUCCESS;
            }

            coinbase::error_t receive(coinbase::api::party_idx_t sender, coinbase::buf_t& msg) override {
              return ctx_->receive(sender, msg);
            }
            coinbase::error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,
                                          std::vector<coinbase::buf_t>& msgs) override {
              std::vector<coinbase::mpc::party_idx_t> s;
              for (auto x: senders) s.push_back(static_cast<coinbase::mpc::party_idx_t>(x));
              return ctx_->receive_all(s, msgs);
            }
           private:
            int self_;
            std::shared_ptr<coinbase::testutils::mpc_net_context_t> ctx_;
            std::shared_ptr<inner_mut_state_t> st_;
          };

          template <typename F>
          static void run_inner_case(const std::vector<std::shared_ptr<coinbase::testutils::mpc_net_context_t>>& peers,
                                     F&& f, std::vector<coinbase::error_t>& rvs,
                                     const std::shared_ptr<inner_mut_state_t>& st) {
            for (auto& p: peers) p->reset();
            rvs.assign(peers.size(), UNINITIALIZED_ERROR);
            st->timed_out.store(false);
            { std::lock_guard<std::mutex> lk(st->mu); st->exceptions.clear(); }
            std::atomic<bool> abort_once{false}, done{false};
            std::vector<std::thread> th;
            for (size_t i=0;i<peers.size();i++) th.emplace_back([&,i]{
              try { rvs[i]=f((int)i); }
              catch(const std::exception& e){
                { std::lock_guard<std::mutex> lk(st->mu); st->exceptions.push_back(e.what()); }
                rvs[i]=E_GENERAL;
              } catch(...) {
                { std::lock_guard<std::mutex> lk(st->mu); st->exceptions.push_back("non-std exception"); }
                rvs[i]=E_GENERAL;
              }
              if (rvs[i] && !abort_once.exchange(true)) for(auto& p:peers) p->abort();
            });
            std::thread wd([&]{
              for(int i=0;i<400 && !done.load();i++) std::this_thread::sleep_for(std::chrono::milliseconds(25));
              if(!done.load()) { st->timed_out.store(true); if(!abort_once.exchange(true)) for(auto& p:peers) p->abort(); }
            });
            for(auto& t:th) t.join(); done.store(true); wd.join();
          }

          TEST(ApiEcdsaMp, TargetedInnerBundleMutation) {
            constexpr int n=2;
            auto st=std::make_shared<inner_mut_state_t>();
            std::vector<std::shared_ptr<coinbase::testutils::mpc_net_context_t>> peers;
            for(int i=0;i<n;i++) peers.push_back(std::make_shared<coinbase::testutils::mpc_net_context_t>(i));
            for(auto& p:peers) p->init_with_peers(peers);
            std::vector<std::shared_ptr<inner_mut_transport_t>> tr;
            for(int i=0;i<n;i++) tr.push_back(std::make_shared<inner_mut_transport_t>(i,peers[i],st));
            std::vector<std::string> names={"p0","p1"};
            std::vector<std::string_view> nv={names[0],names[1]};
            std::vector<coinbase::buf_t> keys(n),sids(n),sigs(n);
            std::vector<coinbase::error_t> rvs;
            coinbase::buf_t msg(32); for(int i=0;i<32;i++) msg[i]=(uint8_t)(i+7);

            st->enabled.store(false);
            run_inner_case(peers,[&](int i){ coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]}; return coinbase::api::ecdsa_mp::dkg_additive(job,coinbase::api::curve_id::secp256k1,keys[i],sids[i]); },rvs,st);
            for(auto rv:rvs) ASSERT_EQ(rv,SUCCESS);
            coinbase::buf_t pub; ASSERT_EQ(coinbase::api::ecdsa_mp::get_public_key_compressed(keys[0],pub),SUCCESS);
            coinbase::crypto::ecc_point_t Q; ASSERT_EQ(Q.from_bin(coinbase::crypto::curve_secp256k1,pub),SUCCESS);
            coinbase::crypto::ecc_pub_key_t verify(Q);

            st->enabled.store(true); st->target_multi=-1; st->multi_seen.store(0);
            run_inner_case(peers,[&](int i){ coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]}; return coinbase::api::ecdsa_mp::sign_additive(job,keys[i],msg,1,sigs[i]); },rvs,st);
            for(auto rv:rvs) ASSERT_EQ(rv,SUCCESS);
            ASSERT_FALSE(sigs[1].empty()); ASSERT_EQ(verify.verify(msg,sigs[1]),SUCCESS);
            int multi_count=st->multi_seen.load();

            std::ofstream out("/code/targeted-results.txt",std::ios::trunc);
            out << "baseline_multi_envelopes=" << multi_count << "\n";
            { std::lock_guard<std::mutex> lk(st->mu); for(auto& x:st->envelope_notes) out << "env=" << x << "\n"; st->envelope_notes.clear(); }

            for(int env=0; env<multi_count; env++) for(int mode=0; mode<6; mode++) {
              for(auto& s:sigs) s.free();
              st->target_multi=env; st->mode=mode; st->multi_seen.store(0); st->mutation_applied.store(false);
              { std::lock_guard<std::mutex> lk(st->mu); st->envelope_notes.clear(); }
              run_inner_case(peers,[&](int i){ coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]}; return coinbase::api::ecdsa_mp::sign_additive(job,keys[i],msg,1,sigs[i]); },rvs,st);
              bool all_success=true; for(auto rv:rvs) all_success &= (rv==SUCCESS);
              bool exc=false; { std::lock_guard<std::mutex> lk(st->mu); exc=!st->exceptions.empty(); }
              out << "case env="<<env<<" mode="<<mode<<" applied="<<st->mutation_applied.load()<<" timeout="<<st->timed_out.load()<<" rvs=";
              for(auto rv:rvs) out<<rv<<',';
              out << " exc="<<exc;
              if(all_success) {
                bool valid=!sigs[1].empty() && verify.verify(msg,sigs[1])==SUCCESS;
                out << " success_valid_sig="<<valid;
              }
              out << "\n"; out.flush();
            }
            out << "complete\n";
          }
          CPP

      - name: Build and run targeted ASAN UBSAN test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEcdsaMp.TargetedInnerBundleMutation' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >/tmp/status.txt
          cp targeted-results.txt /tmp/targeted-results.txt 2>/dev/null || echo 'no targeted result file' >/tmp/targeted-results.txt
          echo 'targeted sanitizer finished; results encrypted next'

      - name: Encrypt results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7/qgkP0IpHQIfyKQYwvS
          Ufx+aug+cHi7A8R3ar0n/FT2FBK0aphD0Jyfp5aq87UIXIjfGA9gdtRsnrxB/iBa
          xtyXtb6m0KKTPU6uPFuWt7e/2BFR7ic3L54hAjJy9Akrstloqbd7CVQULC8okIQS
          1xQYEBW8URYsAo2L748AckGQjy2V15jHq7fC6MLeK4p+/D1iFijMVGFvBvLpUgSN
          RnJagoaiR1eJjUQfkA2+31PGTevs8405ZUnWYJ3w4ikHwdEf65OV1AovGuIBwekn
          Xst6y7BEid59Gv5EU+nhQg5TRDrpIYo7qETP9BwqJmHqw6yaEg4sqJGpkrr3Ne5N
          pQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          mkdir -p /tmp/r
          cp /tmp/status.txt /tmp/r/ 2>/dev/null || true
          cp /tmp/targeted-results.txt /tmp/r/ 2>/dev/null || true
          cp /tmp/sanitize.log /tmp/r/ 2>/dev/null || true
          cp /tmp/image-build.log /tmp/r/ 2>/dev/null || true
          tar -C /tmp/r -czf /tmp/r.tar.gz .
          openssl rand -hex 32 >/tmp/pass.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/r.tar.gz -out /tmp/r.tar.gz.enc -pass file:/tmp/pass.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/pass.txt -out /tmp/pass.txt.enc
          rm -rf /tmp/r /tmp/r.tar.gz /tmp/pass.txt /tmp/status.txt /tmp/targeted-results.txt /tmp/sanitize.log /tmp/image-build.log

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbmpc-targeted-inner-v3
          path: |
            /tmp/r.tar.gz.enc
            /tmp/pass.txt.enc
          retention-days: 1
