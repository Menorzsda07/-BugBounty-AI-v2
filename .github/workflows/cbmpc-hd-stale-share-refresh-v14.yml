name: CBMPC HD Stale Share Refresh V14

on:
  push:
    paths:
      - '.github/workflows/cbmpc-hd-stale-share-refresh-v14.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone exact current cb-mpc
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout 2369813b8b0507ce20febd1d81ef1708cdbb42d7 >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1

      - name: Add stale-share refresh isolation test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_hd_keyset_ecdsa_2p.cpp <<'CPP'

          #include <fstream>

          TEST(ApiHdKeysetEcdsa2p, StaleShareRefreshIsolationVerdictV14) {
            using coinbase::buf_t;
            using coinbase::error_t;
            using coinbase::api::curve_id;
            using coinbase::api::ecdsa_2p::party_t;
            using coinbase::testutils::mpc_net_context_t;
            using coinbase::testutils::api_harness::local_api_transport_t;
            using coinbase::testutils::api_harness::run_2pc;

            auto c1 = std::make_shared<mpc_net_context_t>(0);
            auto c2 = std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers = {c1, c2};
            c1->init_with_peers(peers); c2->init_with_peers(peers);
            local_api_transport_t t1(c1), t2(c2);
            const coinbase::api::job_2p_t job1{party_t::p1, "p1", "p2", t1};
            const coinbase::api::job_2p_t job2{party_t::p2, "p1", "p2", t2};

            error_t rv1=UNINITIALIZED_ERROR, rv2=UNINITIALIZED_ERROR;
            buf_t old1, old2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::dkg(job1,curve_id::secp256k1,old1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::dkg(job2,curve_id::secp256k1,old2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS); ASSERT_EQ(rv2,SUCCESS);

            buf_t fresh1, fresh2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::refresh(job1,old1,fresh1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::refresh(job2,old2,fresh2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS); ASSERT_EQ(rv2,SUCCESS);

            buf_t root_old, root_new;
            ASSERT_EQ(coinbase::api::hd_keyset_ecdsa_2p::extract_root_public_key_compressed(old1,root_old),SUCCESS);
            ASSERT_EQ(coinbase::api::hd_keyset_ecdsa_2p::extract_root_public_key_compressed(fresh1,root_new),SUCCESS);
            ASSERT_EQ(root_old,root_new);

            coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t hard;
            hard.indices={0x8000002c,0x80000000,0x80000000};
            std::vector<coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t> nh;
            nh.push_back(coinbase::api::hd_keyset_ecdsa_2p::bip32_path_t{{0,7}});

            // Control: refreshed shares must derive normally with a caller-supplied identical SID.
            buf_t ctl_sid1("v14-control-sid"), ctl_sid2("v14-control-sid");
            std::vector<buf_t> ctl1,ctl2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job1,fresh1,hard,nh,ctl_sid1,ctl1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job2,fresh2,hard,nh,ctl_sid2,ctl2);},rv1,rv2);
            ASSERT_EQ(rv1,SUCCESS); ASSERT_EQ(rv2,SUCCESS);
            ASSERT_EQ(ctl1.size(),1u); ASSERT_EQ(ctl2.size(),1u);

            int cross_derive_success=0, cross_sign_success=0, pub_match=0;
            error_t c1rv1=UNINITIALIZED_ERROR,c1rv2=UNINITIALIZED_ERROR;
            error_t c2rv1=UNINITIALIZED_ERROR,c2rv2=UNINITIALIZED_ERROR;
            error_t s1rv1=UNINITIALIZED_ERROR,s1rv2=UNINITIALIZED_ERROR;
            error_t s2rv1=UNINITIALIZED_ERROR,s2rv2=UNINITIALIZED_ERROR;

            // Cross A: stale P1 share + refreshed P2 share.
            buf_t sidA1("v14-cross-a"),sidA2("v14-cross-a");
            std::vector<buf_t> a1,a2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job1,old1,hard,nh,sidA1,a1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job2,fresh2,hard,nh,sidA2,a2);},c1rv1,c1rv2);
            if(c1rv1==SUCCESS && c1rv2==SUCCESS && a1.size()==1 && a2.size()==1){
              cross_derive_success++;
              buf_t p1,p2;
              if(coinbase::api::ecdsa_2p::get_public_key_compressed(a1[0],p1)==SUCCESS &&
                 coinbase::api::ecdsa_2p::get_public_key_compressed(a2[0],p2)==SUCCESS && p1==p2) pub_match++;
              buf_t h(32); for(int i=0;i<h.size();i++)h[i]=(uint8_t)(0x41+i);
              buf_t ss1("v14-sign-a"),ss2("v14-sign-a"),sig1,sig2;
              run_2pc(c1,c2,
                [&]{return coinbase::api::ecdsa_2p::sign(job1,a1[0],h,ss1,sig1);},
                [&]{return coinbase::api::ecdsa_2p::sign(job2,a2[0],h,ss2,sig2);},s1rv1,s1rv2);
              if(s1rv1==SUCCESS && s1rv2==SUCCESS && !sig1.empty()) cross_sign_success++;
            }

            // Cross B: refreshed P1 share + stale P2 share.
            buf_t sidB1("v14-cross-b"),sidB2("v14-cross-b");
            std::vector<buf_t> b1,b2;
            run_2pc(c1,c2,
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job1,fresh1,hard,nh,sidB1,b1);},
              [&]{return coinbase::api::hd_keyset_ecdsa_2p::derive_ecdsa_2p_keys(job2,old2,hard,nh,sidB2,b2);},c2rv1,c2rv2);
            if(c2rv1==SUCCESS && c2rv2==SUCCESS && b1.size()==1 && b2.size()==1){
              cross_derive_success++;
              buf_t p1,p2;
              if(coinbase::api::ecdsa_2p::get_public_key_compressed(b1[0],p1)==SUCCESS &&
                 coinbase::api::ecdsa_2p::get_public_key_compressed(b2[0],p2)==SUCCESS && p1==p2) pub_match++;
              buf_t h(32); for(int i=0;i<h.size();i++)h[i]=(uint8_t)(0x61+i);
              buf_t ss1("v14-sign-b"),ss2("v14-sign-b"),sig1,sig2;
              run_2pc(c1,c2,
                [&]{return coinbase::api::ecdsa_2p::sign(job1,b1[0],h,ss1,sig1);},
                [&]{return coinbase::api::ecdsa_2p::sign(job2,b2[0],h,ss2,sig2);},s2rv1,s2rv2);
              if(s2rv1==SUCCESS && s2rv2==SUCCESS && !sig1.empty()) cross_sign_success++;
            }

            std::ofstream out("/code/v14-verdict.txt",std::ios::trunc);
            out<<"crossA_derive_rv="<<c1rv1<<","<<c1rv2
               <<" crossA_sign_rv="<<s1rv1<<","<<s1rv2
               <<" crossB_derive_rv="<<c2rv1<<","<<c2rv2
               <<" crossB_sign_rv="<<s2rv1<<","<<s2rv2
               <<" cross_derive_success="<<cross_derive_success
               <<" pub_match="<<pub_match
               <<" cross_sign_success="<<cross_sign_success<<"\n";
          }
          CPP

      - name: Build and run ASAN UBSAN stale-share test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiHdKeysetEcdsa2p.StaleShareRefreshIsolationVerdictV14' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v14-verdict.txt ]; then cat v14-verdict.txt; else echo 'verdict_missing=1'; fi
          if [ "$status" -ne 0 ]; then
            echo 'V14_SANITIZER_OR_TEST_FAILURE=1'
            tail -n 60 /tmp/sanitize.log
            exit 1
          fi
          signok=$(sed -n 's/.*cross_sign_success=\([0-9][0-9]*\).*/\1/p' v14-verdict.txt)
          if [ "${signok:-0}" -gt 0 ]; then
            echo 'HD_STALE_SHARE_REFRESH_CANDIDATE=1'
            exit 2
          fi
          echo 'HD_STALE_SHARE_REFRESH_CANDIDATE=0'
