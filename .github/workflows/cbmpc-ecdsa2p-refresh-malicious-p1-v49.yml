name: CBMPC ECDSA2P Refresh Malicious P1 V49

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-ecdsa2p-refresh-malicious-p1-v49.yml'
      - 'pocs/cbmpc_ecdsa2p_refresh_mutation_v48.cpp'
      - 'pocs/cbmpc_ecdsa2p_refresh_mutation_v48_CMakeLists.txt'

permissions:
  contents: read

jobs:
  malicious-p1-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch probe and exact upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Menorzsda07/-BugBounty-AI-v2.git audit >/dev/null 2>&1
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"
          cd ..
          mkdir -p cb-mpc/poc-v49
          cp audit/pocs/cbmpc_ecdsa2p_refresh_mutation_v48.cpp cb-mpc/poc-v49/v49.cpp
          cp audit/pocs/cbmpc_ecdsa2p_refresh_mutation_v48_CMakeLists.txt cb-mpc/poc-v49/CMakeLists.txt

          # Re-target the v48 harness from malicious P2->P1 to malicious P1->P2.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/poc-v49/v49.cpp')
          s=p.read_text()
          s=s.replace('int target=-1,kind=-1,p2p1=0;', 'int target=-1,kind=-1,p1p2=0;')
          s=s.replace('if(s_==1&&r==0){int ord;{std::lock_guard<std::mutex> l(n_->sm);ord=++n_->p2p1;}',
                      'if(s_==0&&r==1){int ord;{std::lock_guard<std::mutex> l(n_->sm);ord=++n_->p1p2;}')
          s=s.replace('r.sends=n->p2p1;', 'r.sends=n->p1p2;')
          s=s.replace('V48_', 'V49_')
          p.write_text(s)
          cm=Path('cb-mpc/poc-v49/CMakeLists.txt')
          c=cm.read_text().replace('cbmpc_ecdsa2p_refresh_mutation_v48.cpp','v49.cpp')
          c=c.replace('cbmpc-ecdsa2p-refresh-v48','cbmpc-ecdsa2p-refresh-v49')
          cm.write_text(c)
          PY

          if grep -q 'include-internal\|cbmpc/internal' cb-mpc/poc-v49/v49.cpp; then
            echo 'V49_PUBLIC_ONLY_SOURCE_CHECK=0'; exit 1
          fi
          echo 'V49_PUBLIC_ONLY_SOURCE_CHECK=1'

      - name: Build project image
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/v49-image.log 2>&1

      - name: Build sanitized public library and test malicious P1 refresh
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          set +e
          timeout 45m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc '
            set -euo pipefail
            cd /code
            SAN="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=enum"
            cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF \
              -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
            cmake --build build/Debug -- -j2
            scripts/install.sh --mode public --build-type Debug --prefix /code/build/install/v49
            test -d /code/build/install/v49/include/cbmpc/api
            test ! -d /code/build/install/v49/include/cbmpc/internal
            cmake -S /code/poc-v49 -B /code/build/poc-v49 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCBMPC_REPO_ROOT=/code \
              -DCBMPC_SOURCE_DIR=/code/build/install/v49
            cmake --build /code/build/poc-v49 -- -j2
            ASAN_OPTIONS="detect_leaks=0:halt_on_error=1:abort_on_error=1" \
            UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1" \
              /code/build/poc-v49/cbmpc-ecdsa2p-refresh-v49 | tee /code/v49-verdict.txt
          ' > /tmp/v49.log 2>&1
          status=$?
          set -e
          echo "V49_PROCESS_EXIT=$status"
          cat /tmp/v49.log
          if grep -Eq 'ERROR: AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer|heap-use-after-free|heap-buffer-overflow|stack-buffer-overflow|global-buffer-overflow' /tmp/v49.log; then
            echo 'V49_MEMORY_SAFETY_CANDIDATE=1'; exit 3
          fi
          if grep -q 'V49_REFRESH_KEY_INTEGRITY_CANDIDATE=1' /tmp/v49.log; then
            echo 'V49_KEY_INTEGRITY_CANDIDATE=1'; exit 4
          fi
          if [ "$status" -ne 0 ]; then echo 'V49_NON_SANITIZER_FAILURE=1'; exit "$status"; fi
          grep -q 'V49_REFRESH_KEY_INTEGRITY_CANDIDATE=0' /tmp/v49.log
          echo 'V49_KEY_INTEGRITY_CANDIDATE=0'
