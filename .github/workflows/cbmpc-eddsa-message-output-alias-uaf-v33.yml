name: CBMPC EdDSA Message Output Alias UAF V33

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-eddsa-message-output-alias-uaf-v33.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add public EdDSA2P message-output alias test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_eddsa2pc.cpp <<'CPP'

          TEST(ApiEddsa2pc, SignMessageOutputAliasVerdictV33) {
            auto c1 = std::make_shared<mpc_net_context_t>(0);
            auto c2 = std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers = {c1, c2};
            c1->init_with_peers(peers);
            c2->init_with_peers(peers);
            local_api_transport_t t1(c1);
            local_api_transport_t t2(c2);

            const coinbase::api::job_2p_t job1{party_t::p1, "p1", "p2", t1};
            const coinbase::api::job_2p_t job2{party_t::p2, "p1", "p2", t2};
            buf_t key1, key2;
            error_t rv1 = UNINITIALIZED_ERROR, rv2 = UNINITIALIZED_ERROR;
            run_2pc(c1, c2,
                    [&] { return coinbase::api::eddsa_2p::dkg(job1, curve_id::ed25519, key1); },
                    [&] { return coinbase::api::eddsa_2p::dkg(job2, curve_id::ed25519, key2); },
                    rv1, rv2);
            ASSERT_EQ(rv1, SUCCESS);
            ASSERT_EQ(rv2, SUCCESS);

            // Heap-backed message. P1 reuses this same buf_t as the signature output.
            buf_t msg1(512), msg2(512);
            for (int i = 0; i < msg1.size(); ++i) {
              msg1[i] = static_cast<uint8_t>(i ^ 0x5a);
              msg2[i] = msg1[i];
            }
            mem_t msg1_view = msg1;

            run_2pc(c1, c2,
                    [&] { return coinbase::api::eddsa_2p::sign(job1, key1, msg1_view, msg1); },
                    [&] {
                      buf_t sig2;
                      return coinbase::api::eddsa_2p::sign(job2, key2, msg2, sig2);
                    },
                    rv1, rv2);
          }
          CPP

      - name: Build and run ASAN UBSAN alias test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEddsa2pc.SignMessageOutputAliasVerdictV33' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if grep -Eq 'heap-use-after-free|AddressSanitizer.*use-after-free' /tmp/sanitize.log; then
            echo 'PUBLIC_EDDSA_MESSAGE_ALIAS_UAF_CANDIDATE=1'
            grep -n -A55 -B10 -E 'heap-use-after-free|AddressSanitizer.*use-after-free' /tmp/sanitize.log | head -n 140
            exit 2
          fi
          if grep -Eq 'AddressSanitizer|heap-buffer-overflow|stack-buffer-overflow|SEGV|runtime error:' /tmp/sanitize.log; then
            echo 'PUBLIC_EDDSA_MESSAGE_ALIAS_MEMORY_SAFETY_CANDIDATE=1'
            tail -n 160 /tmp/sanitize.log
            exit 2
          fi
          if [ "$status" -ne 0 ]; then
            echo 'V33_TEST_OR_BUILD_FAILURE=1'
            tail -n 160 /tmp/sanitize.log
            exit 1
          fi
          echo 'PUBLIC_EDDSA_MESSAGE_ALIAS_UAF_CANDIDATE=0'
