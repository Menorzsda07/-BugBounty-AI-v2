name: CBMPC EdDSA Message Output Alias UAF V34

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-eddsa-message-output-alias-uaf-v34.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Clone current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add attacker-message aliasing test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_eddsa2pc.cpp <<'CPP'

          TEST(ApiEdDSA2pcAliasV34, SignOutputAliasesLargeMessage) {
            auto c1 = std::make_shared<mpc_net_context_t>(0);
            auto c2 = std::make_shared<mpc_net_context_t>(1);
            std::vector<std::shared_ptr<mpc_net_context_t>> peers = {c1, c2};
            c1->init_with_peers(peers);
            c2->init_with_peers(peers);
            local_api_transport_t t1(c1), t2(c2);
            const coinbase::api::job_2p_t job1{party_t::p1, "p1", "p2", t1};
            const coinbase::api::job_2p_t job2{party_t::p2, "p1", "p2", t2};

            buf_t k1, k2;
            error_t rv1 = UNINITIALIZED_ERROR, rv2 = UNINITIALIZED_ERROR;
            run_2pc(c1, c2,
              [&] { return coinbase::api::eddsa_2p::dkg(job1, curve_id::ed25519, k1); },
              [&] { return coinbase::api::eddsa_2p::dkg(job2, curve_id::ed25519, k2); }, rv1, rv2);
            ASSERT_EQ(rv1, SUCCESS); ASSERT_EQ(rv2, SUCCESS);

            // Heap-backed, attacker-style payload (> buf_t short_size=36).
            buf_t msg1(4096), msg2(4096);
            for (int i=0;i<4096;i++) {
              const uint8_t b = static_cast<uint8_t>((i * 131 + 17) & 0xff);
              msg1[i] = b; msg2[i] = b;
            }
            buf_t sig2;

            // Reuse the P1 request/message buffer for its signature output.
            // The public wrapper calls sig.free() before the protocol consumes msg.
            run_2pc(c1, c2,
              [&] { return coinbase::api::eddsa_2p::sign(job1, k1, msg1, msg1); },
              [&] { return coinbase::api::eddsa_2p::sign(job2, k2, msg2, sig2); }, rv1, rv2);
          }
          CPP

      - name: Build and run ASAN UBSAN test
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 30m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEdDSA2pcAliasV34.SignOutputAliasesLargeMessage' >/tmp/v34.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if grep -Eqi 'heap-use-after-free|AddressSanitizer' /tmp/v34.log; then
            echo 'EDDSA_ATTACKER_MESSAGE_ALIAS_UAF_CONFIRMED=1'
            grep -Ein -C 10 'heap-use-after-free|AddressSanitizer' /tmp/v34.log | head -n 160 || true
            exit 2
          fi
          echo 'EDDSA_ATTACKER_MESSAGE_ALIAS_UAF_CONFIRMED=0'
          tail -n 120 /tmp/v34.log
          if [ "$status" -ne 0 ]; then exit 1; fi
