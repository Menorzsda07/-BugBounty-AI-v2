name: CBMPC EdDSA AC 2of3 All DKG V41

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-eddsa-ac-2of3-all-dkg-v41.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Clone exact current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add all-contributor 2-of-3 exploit and control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_eddsa_mp_ac.cpp <<'CPP'

          #include <fstream>

          namespace {
          struct v41_fixture_t {
            static constexpr int n = 3;
            std::vector<std::shared_ptr<mpc_net_context_t>> peers;
            std::vector<std::shared_ptr<local_api_transport_t>> transports;
            std::vector<std::string> names = {"honest-p0", "malicious-p1", "offline-p2"};
            std::vector<std::string_view> all_names;
            coinbase::api::access_structure_t ac;
            std::vector<buf_t> keys, sids;
            buf_t pub;

            v41_fixture_t()
              : ac(coinbase::api::access_structure_t::Threshold(
                    2, {coinbase::api::access_structure_t::leaf(names[0]),
                        coinbase::api::access_structure_t::leaf(names[1]),
                        coinbase::api::access_structure_t::leaf(names[2])})),
                keys(n), sids(n) {
              all_names = {names[0], names[1], names[2]};
              for (int i=0;i<n;++i) peers.push_back(std::make_shared<mpc_net_context_t>(i));
              for (const auto& p : peers) p->init_with_peers(peers);
              for (const auto& p : peers) transports.push_back(std::make_shared<local_api_transport_t>(p));
            }

            void dkg_all() {
              std::vector<error_t> rvs;
              // All three parties actively contribute to the original DKG.
              const std::vector<std::string_view> all_contributors = all_names;
              run_mp(peers, [&](int i) {
                job_mp_t job{static_cast<party_idx_t>(i), all_names, *transports[static_cast<size_t>(i)]};
                return coinbase::api::eddsa_mp::dkg_ac(job, curve_id::ed25519,
                                                       sids[static_cast<size_t>(i)], ac, all_contributors,
                                                       keys[static_cast<size_t>(i)]);
              }, rvs);
              ASSERT_EQ(rvs.size(), static_cast<size_t>(n));
              for (auto rv : rvs) ASSERT_EQ(rv, SUCCESS);
              ASSERT_EQ(coinbase::api::eddsa_mp::get_public_key_compressed(keys[0], pub), SUCCESS);
            }
          };
          }

          TEST(ApiEdDSAMpAcAliasV41, AllThreeContributeThenTwoOfThreeAttackerGetsUnapprovedSignature) {
            v41_fixture_t f;
            f.dkg_all();

            coinbase::crypto::ecc_point_t Q;
            ASSERT_EQ(Q.from_bin(coinbase::crypto::curve_ed25519, f.pub), SUCCESS);
            const coinbase::crypto::ecc_pub_key_t verify_key(Q);

            // Only p0 + p1 are online at signing time; p2 is offline.
            std::vector<std::shared_ptr<mpc_net_context_t>> sign_peers = {f.peers[0], f.peers[1]};
            std::vector<std::shared_ptr<local_api_transport_t>> sign_transports = {f.transports[0], f.transports[1]};
            const std::vector<std::string_view> online_names = {f.names[0], f.names[1]};

            buf_t honest_msg(32);
            for (int i=0;i<32;++i) honest_msg[i]=static_cast<uint8_t>(0x71 + (i % 8));
            const buf_t approved = honest_msg;
            buf_t malicious_msg(32); malicious_msg.bzero();
            const buf_t attacker_msg = malicious_msg;
            buf_t attacker_sig;
            std::vector<error_t> rvs;

            run_mp(sign_peers, [&](int i) {
              job_mp_t job{static_cast<party_idx_t>(i), online_names, *sign_transports[static_cast<size_t>(i)]};
              if (i == 0)
                return coinbase::api::eddsa_mp::sign_ac(job, f.keys[0], f.ac, honest_msg, 1, honest_msg);
              return coinbase::api::eddsa_mp::sign_ac(job, f.keys[1], f.ac, malicious_msg, 1, attacker_sig);
            }, rvs);

            const int all_success=(rvs.size()==2 && rvs[0]==SUCCESS && rvs[1]==SUCCESS)?1:0;
            const int recv=(attacker_sig.size()==64)?1:0;
            const int va=recv && verify_key.verify(attacker_msg, attacker_sig)==SUCCESS ? 1:0;
            const int vh=recv && verify_key.verify(approved, attacker_sig)==SUCCESS ? 1:0;
            std::ofstream out("/code/v41-exploit.txt", std::ios::trunc);
            out << "dkg_contributors=3 threshold=2of3 signing_online=2 offline=1"
                << " all_success=" << all_success << " attacker_received=" << recv
                << " verifies_attacker_zero=" << va << " verifies_honest_approved=" << vh
                << " attacker_sig_size=" << attacker_sig.size() << "\n";
          }

          TEST(ApiEdDSAMpAcAliasV41, AllThreeContributeNonAliasingControlRejectsMismatch) {
            v41_fixture_t f;
            f.dkg_all();

            std::vector<std::shared_ptr<mpc_net_context_t>> sign_peers = {f.peers[0], f.peers[1]};
            std::vector<std::shared_ptr<local_api_transport_t>> sign_transports = {f.transports[0], f.transports[1]};
            const std::vector<std::string_view> online_names = {f.names[0], f.names[1]};
            buf_t honest_msg(32);
            for (int i=0;i<32;++i) honest_msg[i]=static_cast<uint8_t>(0x71 + (i % 8));
            buf_t malicious_msg(32); malicious_msg.bzero();
            buf_t honest_out, attacker_sig;
            std::vector<error_t> rvs;

            run_mp(sign_peers, [&](int i) {
              job_mp_t job{static_cast<party_idx_t>(i), online_names, *sign_transports[static_cast<size_t>(i)]};
              if (i == 0)
                return coinbase::api::eddsa_mp::sign_ac(job, f.keys[0], f.ac, honest_msg, 1, honest_out);
              return coinbase::api::eddsa_mp::sign_ac(job, f.keys[1], f.ac, malicious_msg, 1, attacker_sig);
            }, rvs);

            const int all_success=(rvs.size()==2 && rvs[0]==SUCCESS && rvs[1]==SUCCESS)?1:0;
            const int recv=!attacker_sig.empty()?1:0;
            std::ofstream out("/code/v41-control.txt", std::ios::trunc);
            out << "all_success=" << all_success << " attacker_received=" << recv
                << " honest_preserved=" << ((honest_msg.size()==32 && honest_msg[0]==0x71)?1:0) << "\n";
          }
          CPP

      - name: Build sanitizer image
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1

      - name: Run all-contributor exploit
        shell: bash
        run: |
          set +e
          cd cb-mpc
          timeout 35m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEdDSAMpAcAliasV41.AllThreeContributeThenTwoOfThreeAttackerGetsUnapprovedSignature' >/tmp/v41e.log 2>&1
          status=$?
          echo "exploit_sanitize_exit=$status"
          cat v41-exploit.txt 2>/dev/null || echo exploit_verdict_missing=1
          if grep -Eqi 'AddressSanitizer|runtime error:' /tmp/v41e.log; then
            echo V41_EXPLOIT_UNEXPECTED_SANITIZER=1
            grep -Ein -C 6 'AddressSanitizer|runtime error:' /tmp/v41e.log | head -n 100 || true
          fi
          exit 0

      - name: Run all-contributor non-aliasing control
        shell: bash
        run: |
          set +e
          cd cb-mpc
          timeout 35m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEdDSAMpAcAliasV41.AllThreeContributeNonAliasingControlRejectsMismatch' >/tmp/v41c.log 2>&1
          status=$?
          echo "control_sanitize_exit=$status"
          cat v41-control.txt 2>/dev/null || echo control_verdict_missing=1
          if grep -Eqi 'AddressSanitizer|runtime error:' /tmp/v41c.log; then
            echo V41_CONTROL_UNEXPECTED_SANITIZER=1
            grep -Ein -C 6 'AddressSanitizer|runtime error:' /tmp/v41c.log | head -n 100 || true
          fi
          exit 0

      - name: Final verdict
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          e_success=$(sed -n 's/.*all_success=\([0-9][0-9]*\).*/\1/p' v41-exploit.txt)
          e_recv=$(sed -n 's/.*attacker_received=\([0-9][0-9]*\).*/\1/p' v41-exploit.txt)
          e_va=$(sed -n 's/.*verifies_attacker_zero=\([0-9][0-9]*\).*/\1/p' v41-exploit.txt)
          e_vh=$(sed -n 's/.*verifies_honest_approved=\([0-9][0-9]*\).*/\1/p' v41-exploit.txt)
          c_success=$(sed -n 's/.*all_success=\([0-9][0-9]*\).*/\1/p' v41-control.txt)
          c_recv=$(sed -n 's/.*attacker_received=\([0-9][0-9]*\).*/\1/p' v41-control.txt)
          c_pres=$(sed -n 's/.*honest_preserved=\([0-9][0-9]*\).*/\1/p' v41-control.txt)
          if [ "${e_success:-0}" -eq 1 ] && [ "${e_recv:-0}" -eq 1 ] && [ "${e_va:-0}" -eq 1 ] && [ "${e_vh:-1}" -eq 0 ] && [ "${c_success:-1}" -eq 0 ] && [ "${c_recv:-1}" -eq 0 ] && [ "${c_pres:-0}" -eq 1 ]; then
            echo 'EDDSA_2OF3_ALL_DKG_UNAUTHORIZED_SIGNATURE_CONFIRMED=1'
            exit 2
          fi
          echo 'EDDSA_2OF3_ALL_DKG_UNAUTHORIZED_SIGNATURE_CONFIRMED=0'
          exit 1
