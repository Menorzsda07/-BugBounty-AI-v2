name: CBMPC EdDSA MP Attacker Receiver Control V39

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cbmpc-eddsa-mp-attacker-receiver-control-v39.yml'

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone exact current cb-mpc HEAD
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout fdbb60346757271d5e0241f417e55dc8f289573c >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1
          echo "tested_commit=$(git rev-parse HEAD)"

      - name: Add non-aliasing attacker-receiver control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          p.write_text(p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());'))
          PY
          cat >> cb-mpc/tests/unit/api/test_eddsa_mp.cpp <<'CPP'

          #include <fstream>

          TEST(ApiEdDSAMpAliasV39, DistinctOutputPreventsAttackerReceiverSignature) {
            constexpr int n = 2;
            std::vector<std::shared_ptr<mpc_net_context_t>> peers;
            peers.reserve(n);
            for (int i = 0; i < n; ++i) peers.push_back(std::make_shared<mpc_net_context_t>(i));
            for (const auto& p : peers) p->init_with_peers(peers);

            std::vector<std::shared_ptr<local_api_transport_t>> transports;
            transports.reserve(n);
            for (const auto& p : peers) transports.push_back(std::make_shared<local_api_transport_t>(p));

            std::vector<std::string> names = {"honest-p0", "malicious-p1"};
            std::vector<std::string_view> name_views = {names[0], names[1]};

            std::vector<buf_t> keys(n), sids(n);
            std::vector<error_t> rvs;
            run_mp(peers, [&](int i) {
              job_mp_t job{static_cast<party_idx_t>(i), name_views, *transports[static_cast<size_t>(i)]};
              return coinbase::api::eddsa_mp::dkg_additive(job, curve_id::ed25519,
                                                           keys[static_cast<size_t>(i)],
                                                           sids[static_cast<size_t>(i)]);
            }, rvs);
            for (auto rv : rvs) ASSERT_EQ(rv, SUCCESS);

            buf_t honest_msg(32);
            for (int i = 0; i < 32; ++i) honest_msg[i] = static_cast<uint8_t>(0x31 + (i % 10));
            buf_t malicious_msg(32);
            malicious_msg.bzero();

            // Control: honest P0 uses a separate output object, so its approved
            // non-zero message is preserved. P1 still requests itself as receiver
            // while using the zero message. The protocol must detect mismatch.
            buf_t honest_out, attacker_sig;
            run_mp(peers, [&](int i) {
              job_mp_t job{static_cast<party_idx_t>(i), name_views, *transports[static_cast<size_t>(i)]};
              if (i == 0)
                return coinbase::api::eddsa_mp::sign_additive(job, keys[0], honest_msg,
                                                              /*sig_receiver=*/1, honest_out);
              return coinbase::api::eddsa_mp::sign_additive(job, keys[1], malicious_msg,
                                                            /*sig_receiver=*/1, attacker_sig);
            }, rvs);

            const int all_success = (rvs.size() == 2 && rvs[0] == SUCCESS && rvs[1] == SUCCESS) ? 1 : 0;
            const int attacker_received = !attacker_sig.empty() ? 1 : 0;
            const int honest_preserved = (honest_msg.size() == 32 && honest_msg[0] == 0x31) ? 1 : 0;

            std::ofstream out("/code/v39-verdict.txt", std::ios::trunc);
            out << "commit=fdbb60346757271d5e0241f417e55dc8f289573c"
                << " rvs=" << (rvs.size() > 0 ? rvs[0] : -999) << "," << (rvs.size() > 1 ? rvs[1] : -999)
                << " all_success=" << all_success
                << " attacker_received=" << attacker_received
                << " honest_msg_preserved=" << honest_preserved
                << " attacker_sig_size=" << attacker_sig.size() << "\n";
          }
          CPP

      - name: Build and run ASAN UBSAN control
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 35m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEdDSAMpAliasV39.DistinctOutputPreventsAttackerReceiverSignature' >/tmp/v39.log 2>&1
          status=$?
          set -e
          echo "sanitize_exit=$status"
          if [ -f v39-verdict.txt ]; then cat v39-verdict.txt; else echo 'verdict_missing=1'; fi
          if grep -Eqi 'AddressSanitizer|runtime error:' /tmp/v39.log; then
            echo 'V39_UNEXPECTED_SANITIZER_FINDING=1'
            grep -Ein -C 8 'AddressSanitizer|runtime error:' /tmp/v39.log | head -n 120 || true
            exit 2
          fi
          if [ "$status" -ne 0 ]; then
            echo 'V39_TEST_OR_BUILD_FAILURE=1'
            tail -n 140 /tmp/v39.log
            exit 1
          fi
          success=$(sed -n 's/.*all_success=\([0-9][0-9]*\).*/\1/p' v39-verdict.txt)
          recv=$(sed -n 's/.*attacker_received=\([0-9][0-9]*\).*/\1/p' v39-verdict.txt)
          preserved=$(sed -n 's/.*honest_msg_preserved=\([0-9][0-9]*\).*/\1/p' v39-verdict.txt)
          if [ "${success:-1}" -eq 0 ] && [ "${recv:-1}" -eq 0 ] && [ "${preserved:-0}" -eq 1 ]; then
            echo 'EDDSA_MP_ATTACKER_RECEIVER_CONTROL_REJECTED=1'
            exit 0
          fi
          echo 'EDDSA_MP_ATTACKER_RECEIVER_CONTROL_REJECTED=0'
          exit 2
