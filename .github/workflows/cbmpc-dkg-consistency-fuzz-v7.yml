name: CBMPC DKG Consistency Fuzz V7

on:
  push:
    paths:
      - '.github/workflows/cbmpc-dkg-consistency-fuzz-v7.yml'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone exact cb-mpc HEAD
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout 2369813b8b0507ce20febd1d81ef1708cdbb42d7 >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1

      - name: Prepare test runner copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          s=p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());')
          p.write_text(s)
          PY
          cat >> cb-mpc/tests/unit/api/test_ecdsa_mp.cpp <<'CPP'

          #include <chrono>
          #include <fstream>
          #include <mutex>

          namespace {
          struct dkg_mut_state_t {
            std::atomic<bool> enabled{false};
            std::atomic<int> send_counter{0};
            int attacker=0;
            int target_send=-1;
            int mode=0;
            std::atomic<bool> timed_out{false};
            std::mutex mu;
            std::vector<std::string> exceptions;
          };

          class dkg_mut_transport_t final : public coinbase::api::data_transport_i {
           public:
            dkg_mut_transport_t(int self, std::shared_ptr<coinbase::testutils::mpc_net_context_t> ctx,
                                std::shared_ptr<dkg_mut_state_t> st):self_(self),ctx_(std::move(ctx)),st_(std::move(st)){}
            coinbase::error_t send(coinbase::api::party_idx_t receiver, coinbase::mem_t msg) override {
              if(st_->enabled.load() && self_==st_->attacker) {
                int seq=st_->send_counter.fetch_add(1);
                if(seq==st_->target_send && msg.size>0) {
                  coinbase::buf_t b(msg);
                  int pos=0;
                  switch(st_->mode) {
                    case 0: pos=0; break;
                    case 1: pos=b.size()/4; break;
                    case 2: pos=b.size()/2; break;
                    case 3: pos=(b.size()*3)/4; break;
                    case 4: pos=b.size()-1; break;
                    case 5: if(b.size()>1) b=coinbase::buf_t(b.take(b.size()-1)); ctx_->send(receiver,b); return SUCCESS;
                    default: break;
                  }
                  if(pos<0) pos=0; if(pos>=b.size()) pos=b.size()-1;
                  b[pos]^=(uint8_t)(0x80u | (1u << (st_->mode%7)));
                  ctx_->send(receiver,b); return SUCCESS;
                }
              }
              ctx_->send(receiver,msg); return SUCCESS;
            }
            coinbase::error_t receive(coinbase::api::party_idx_t sender, coinbase::buf_t& msg) override { return ctx_->receive(sender,msg); }
            coinbase::error_t receive_all(const std::vector<coinbase::api::party_idx_t>& senders,std::vector<coinbase::buf_t>& msgs) override {
              std::vector<coinbase::mpc::party_idx_t> s; for(auto x:senders)s.push_back((coinbase::mpc::party_idx_t)x); return ctx_->receive_all(s,msgs);
            }
           private:int self_; std::shared_ptr<coinbase::testutils::mpc_net_context_t> ctx_; std::shared_ptr<dkg_mut_state_t> st_;
          };

          template<typename F>
          static void run_dkg_case(const std::vector<std::shared_ptr<coinbase::testutils::mpc_net_context_t>>& peers,F&& f,
                                   std::vector<coinbase::error_t>& rvs,const std::shared_ptr<dkg_mut_state_t>& st){
            for(auto&p:peers)p->reset(); rvs.assign(peers.size(),UNINITIALIZED_ERROR); st->timed_out.store(false);
            {std::lock_guard<std::mutex>lk(st->mu);st->exceptions.clear();}
            std::atomic<bool> abort_once{false},done{false}; std::vector<std::thread> th;
            for(size_t i=0;i<peers.size();i++) th.emplace_back([&,i]{try{rvs[i]=f((int)i);}catch(const std::exception&e){{std::lock_guard<std::mutex>lk(st->mu);st->exceptions.push_back(e.what());}rvs[i]=E_GENERAL;}catch(...){{std::lock_guard<std::mutex>lk(st->mu);st->exceptions.push_back("non-std exception");}rvs[i]=E_GENERAL;} if(rvs[i]&&!abort_once.exchange(true))for(auto&p:peers)p->abort();});
            std::thread wd([&]{for(int k=0;k<400&&!done.load();k++)std::this_thread::sleep_for(std::chrono::milliseconds(25));if(!done.load()){st->timed_out.store(true);if(!abort_once.exchange(true))for(auto&p:peers)p->abort();}});
            for(auto&t:th)t.join();done.store(true);wd.join();
          }
          }

          TEST(ApiEcdsaMp, DkgConsistencyMutationSanitized) {
            constexpr int n=3; auto st=std::make_shared<dkg_mut_state_t>();
            std::vector<std::shared_ptr<coinbase::testutils::mpc_net_context_t>> peers; for(int i=0;i<n;i++)peers.push_back(std::make_shared<coinbase::testutils::mpc_net_context_t>(i)); for(auto&p:peers)p->init_with_peers(peers);
            std::vector<std::shared_ptr<dkg_mut_transport_t>> tr; for(int i=0;i<n;i++)tr.push_back(std::make_shared<dkg_mut_transport_t>(i,peers[i],st));
            std::vector<std::string> names={"p0","p1","p2"}; std::vector<std::string_view> nv={names[0],names[1],names[2]};
            std::vector<coinbase::buf_t> keys(n),sids(n); std::vector<coinbase::error_t> rvs;

            st->enabled.store(false); st->send_counter.store(0);
            run_dkg_case(peers,[&](int i){coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]};return coinbase::api::ecdsa_mp::dkg_additive(job,coinbase::api::curve_id::secp256k1,keys[i],sids[i]);},rvs,st);
            for(auto rv:rvs)ASSERT_EQ(rv,SUCCESS);
            coinbase::buf_t p0,p1,p2; ASSERT_EQ(coinbase::api::ecdsa_mp::get_public_key_compressed(keys[0],p0),SUCCESS); ASSERT_EQ(coinbase::api::ecdsa_mp::get_public_key_compressed(keys[1],p1),SUCCESS); ASSERT_EQ(coinbase::api::ecdsa_mp::get_public_key_compressed(keys[2],p2),SUCCESS); ASSERT_EQ(p0,p1); ASSERT_EQ(p1,p2);

            st->enabled.store(true); st->target_send=-1; st->send_counter.store(0);
            std::vector<coinbase::buf_t> base_keys(n),base_sids(n);
            run_dkg_case(peers,[&](int i){coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]};return coinbase::api::ecdsa_mp::dkg_additive(job,coinbase::api::curve_id::secp256k1,base_keys[i],base_sids[i]);},rvs,st);
            for(auto rv:rvs)ASSERT_EQ(rv,SUCCESS);
            int sends=st->send_counter.load(); int tested=std::min(sends,24);
            std::ofstream out("/code/dkg-results.txt",std::ios::trunc); out<<"baseline_attacker_sends="<<sends<<" tested="<<tested<<"\n";

            for(int sn=0;sn<tested;sn++) for(int mode=0;mode<6;mode++) {
              std::vector<coinbase::buf_t> ks(n),ss(n); st->target_send=sn;st->mode=mode;st->send_counter.store(0);
              run_dkg_case(peers,[&](int i){coinbase::api::job_mp_t job{(coinbase::api::party_idx_t)i,nv,*tr[i]};return coinbase::api::ecdsa_mp::dkg_additive(job,coinbase::api::curve_id::secp256k1,ks[i],ss[i]);},rvs,st);
              bool all=true;for(auto rv:rvs)all&=(rv==SUCCESS); bool exc=false;{std::lock_guard<std::mutex>lk(st->mu);exc=!st->exceptions.empty();}
              out<<"case send="<<sn<<" mode="<<mode<<" timeout="<<st->timed_out.load()<<" exc="<<exc<<" rvs=";for(auto rv:rvs)out<<rv<<',';
              if(all){coinbase::buf_t q0,q1,q2;auto a=coinbase::api::ecdsa_mp::get_public_key_compressed(ks[0],q0);auto b=coinbase::api::ecdsa_mp::get_public_key_compressed(ks[1],q1);auto c=coinbase::api::ecdsa_mp::get_public_key_compressed(ks[2],q2);bool same=(a==SUCCESS&&b==SUCCESS&&c==SUCCESS&&q0==q1&&q1==q2);out<<" all_success_same_pub="<<same; if(!same)out<<" DIVERGENT_SUCCESS=1";}
              out<<"\n";out.flush();
            }
            out<<"complete\n";
          }
          CPP

      - name: Build and run ASAN UBSAN DKG campaign
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiEcdsaMp.DkgConsistencyMutationSanitized' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >/tmp/status.txt
          cp dkg-results.txt /tmp/dkg-results.txt 2>/dev/null || echo 'no dkg result file' >/tmp/dkg-results.txt
          echo 'DKG sanitizer campaign finished; detailed result encrypted next'

      - name: Encrypt results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7/qgkP0IpHQIfyKQYwvS
          Ufx+aug+cHi7A8R3ar0n/FT2FBK0aphD0Jyfp5aq87UIXIjfGA9gdtRsnrxB/iBa
          xtyXtb6m0KKTPU6uPFuWt7e/2BFR7ic3L54hAjJy9Akrstloqbd7CVQULC8okIQS
          1xQYEBW8URYsAo2L748AckGQjy2V15jHq7fC6MLeK4p+/D1iFijMVGFvBvLpUgSN
          RnJagoaiR1eJjUQfkA2+31PGTevs8405ZUnWYJ3w4ikHwdEf65OV1AovGuIBwekn
          Xst6y7BEid59Gv5EU+nhQg5TRDrpIYo7qETP9BwqJmHqw6yaEg4sqJGpkrr3Ne5N
          pQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          mkdir -p /tmp/r; cp /tmp/status.txt /tmp/r/ 2>/dev/null||true;cp /tmp/dkg-results.txt /tmp/r/ 2>/dev/null||true;cp /tmp/sanitize.log /tmp/r/ 2>/dev/null||true;cp /tmp/image-build.log /tmp/r/ 2>/dev/null||true
          tar -C /tmp/r -czf /tmp/r.tar.gz .;openssl rand -hex 32 >/tmp/pass.txt;openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/r.tar.gz -out /tmp/r.tar.gz.enc -pass file:/tmp/pass.txt;openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/pass.txt -out /tmp/pass.txt.enc
          rm -rf /tmp/r /tmp/r.tar.gz /tmp/pass.txt /tmp/status.txt /tmp/dkg-results.txt /tmp/sanitize.log /tmp/image-build.log

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbmpc-dkg-consistency-v7
          path: |
            /tmp/r.tar.gz.enc
            /tmp/pass.txt.enc
          retention-days: 1
