name: Bugcrowd Skyscanner Android Download Discovery V4

on:
  push:
    paths:
      - '.github/workflows/bugcrowd-skyscanner-android-download-discovery-v4.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current public app mirror metadata without target traffic
        shell: bash
        run: |
          set -euo pipefail
          URL='https://skyscanner.en.uptodown.com/android/download'
          curl -sS -L --max-time 30 \
            -H 'User-Agent: Mozilla/5.0' \
            -o /tmp/page.html "$URL"
          echo "PAGE_BYTES=$(wc -c </tmp/page.html)"
          python3 - <<'PY'
          import re, html, json
          s=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          u=html.unescape(s)
          patterns=[
            r'https?://[^"\'<> ]+\.(?:apk|xapk)(?:\?[^"\'<> ]*)?',
            r'https?://[^"\'<> ]*(?:download|dw\.uptodown|d\.uptodown)[^"\'<> ]*',
            r'(?:href|data-url|data-download|data-file|download-url)=["\']([^"\']+)["\']'
          ]
          seen=[]
          for pat in patterns:
            for m in re.finditer(pat,u,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if v not in seen:
                seen.append(v)
          print('CANDIDATE_COUNT',len(seen))
          for i,v in enumerate(seen[:80],1):
            print(f'CANDIDATE_{i}={v[:1000]}')
          for key in ['8d8977e509b6694716614a998a955604996280f1581d0a4dcffa5293173c2ae0','7.204','net.skyscanner.android.main','versionId','downloadUrl','fileId','file_id','version_id']:
            print('\n===',key,'===')
            pos=0; n=0
            while True:
              j=u.lower().find(key.lower(),pos)
              if j<0 or n>=12: break
              print(re.sub(r'\s+',' ',u[max(0,j-500):min(len(u),j+1000)]))
              pos=j+len(key); n+=1
            print('COUNT',n)
          print('V4_DISCOVERY_DONE=1')
          PY
