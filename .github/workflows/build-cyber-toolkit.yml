name: Build Cyber Toolkit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cyber-toolkit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nmap masscan nikto hydra sslscan git curl unzip tar jq perl python3 python3-pip python3-venv ca-certificates

      - name: Build portable toolkit
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/cyber-toolkit"
          mkdir -p "$ROOT/bin" "$ROOT/lib" "$ROOT/share" "$ROOT/tools" "$ROOT/pydeps"

          export GOBIN="$ROOT/bin"
          export CGO_ENABLED=0

          # Core bug bounty / reconnaissance / web testing tools.
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/OJ/gobuster/v3@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/qsreplace@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/unfurl@latest
          go install github.com/hakluke/hakrawler@latest
          go install github.com/jaeles-project/gospider@latest

          # Python/source tools, vendored for offline use in the destination environment.
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git "$ROOT/tools/sqlmap"
          git clone --depth 1 https://github.com/maurosoria/dirsearch.git "$ROOT/tools/dirsearch"
          git clone --depth 1 https://github.com/s0md3v/Arjun.git "$ROOT/tools/arjun"
          git clone --depth 1 https://github.com/EnableSecurity/wafw00f.git "$ROOT/tools/wafw00f"
          git clone --depth 1 https://github.com/commixproject/commix.git "$ROOT/tools/commix"
          git clone --depth 1 https://github.com/s0md3v/XSStrike.git "$ROOT/tools/xsstrike"
          git clone --depth 1 https://github.com/drwetter/testssl.sh.git "$ROOT/tools/testssl"

          # Vendor common Python dependencies into one portable directory.
          python3 -m pip install --break-system-packages --target "$ROOT/pydeps" \
            requests urllib3 certifi charset-normalizer idna colorama beautifulsoup4 soupsieve \
            lxml defusedxml setuptools packaging tldextract filelock dnspython

          # Portable wrappers for source/Python tools.
          cat > "$ROOT/bin/sqlmap" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 "$R/tools/sqlmap/sqlmap.py" "$@"
          EOF
          cat > "$ROOT/bin/dirsearch" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 "$R/tools/dirsearch/dirsearch.py" "$@"
          EOF
          cat > "$ROOT/bin/arjun" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/tools/arjun:$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 -m arjun "$@"
          EOF
          cat > "$ROOT/bin/wafw00f" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/tools/wafw00f:$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 -m wafw00f.main "$@"
          EOF
          cat > "$ROOT/bin/commix" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 "$R/tools/commix/commix.py" "$@"
          EOF
          cat > "$ROOT/bin/xsstrike" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$R/pydeps${PYTHONPATH:+:$PYTHONPATH}" exec python3 "$R/tools/xsstrike/xsstrike.py" "$@"
          EOF
          cat > "$ROOT/bin/testssl" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          exec bash "$R/tools/testssl/testssl.sh" "$@"
          EOF

          # Copy selected system tools together with required shared libraries.
          copy_with_libs() {
            local name="$1"
            local src
            src="$(command -v "$name")"
            cp -L "$src" "$ROOT/bin/${name}.real"
            ldd "$src" 2>/dev/null | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | while read -r lib; do
              [ -f "$lib" ] && cp -Ln "$lib" "$ROOT/lib/" || true
            done
            cat > "$ROOT/bin/$name" <<EOF
          #!/usr/bin/env bash
          R="\$(cd "\$(dirname "\$0")/.." && pwd)"
          exec env LD_LIBRARY_PATH="\$R/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}" "\$R/bin/${name}.real" "\$@"
          EOF
          }

          copy_with_libs nmap
          copy_with_libs masscan
          copy_with_libs hydra
          copy_with_libs sslscan

          # Nmap data files and a wrapper that points at the vendored data directory.
          cp -a /usr/share/nmap "$ROOT/share/"
          cat > "$ROOT/bin/nmap" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          exec env LD_LIBRARY_PATH="$R/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$R/bin/nmap.real" --datadir "$R/share/nmap" "$@"
          EOF

          # Nikto is primarily Perl; vendor its program/data directory.
          if [ -d /usr/share/nikto ]; then cp -a /usr/share/nikto "$ROOT/share/"; fi
          cat > "$ROOT/bin/nikto" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "$0")/.." && pwd)"
          if [ -f "$R/share/nikto/program/nikto.pl" ]; then
            exec perl "$R/share/nikto/program/nikto.pl" "$@"
          fi
          exec perl /usr/share/nikto/program/nikto.pl "$@"
          EOF

          chmod +x "$ROOT/bin/"*
          find "$ROOT/tools" -type d -name .git -prune -exec rm -rf {} +

          # Small manifest for verification in the destination environment.
          {
            echo 'Cyber toolkit generated by GitHub Actions'
            echo "UTC: $(date -u +%FT%TZ)"
            echo 'Tools:'
            ls -1 "$ROOT/bin" | sort
          } > "$ROOT/MANIFEST.txt"

          tar -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/cyber-toolkit-linux-amd64.tar.gz" cyber-toolkit

      - name: Upload toolkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-toolkit-linux-amd64
          path: cyber-toolkit-linux-amd64.tar.gz
          retention-days: 1
          compression-level: 0
