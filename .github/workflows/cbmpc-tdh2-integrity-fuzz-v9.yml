name: CBMPC TDH2 Integrity Fuzz V9

on:
  push:
    paths:
      - '.github/workflows/cbmpc-tdh2-integrity-fuzz-v9.yml'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone exact cb-mpc HEAD
        run: |
          set -euo pipefail
          git clone https://github.com/coinbase/cb-mpc.git cb-mpc >/dev/null 2>&1
          cd cb-mpc
          git checkout 2369813b8b0507ce20febd1d81ef1708cdbb42d7 >/dev/null 2>&1
          git submodule update --init --recursive >/dev/null 2>&1

      - name: Add TDH2 integrity mutation test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cb-mpc/tests/utils/local_network/channel.cpp')
          s=p.read_text().replace('    delete queue.front();','    test_message_buffer_t::free(queue.front());')
          p.write_text(s)
          PY
          cat >> cb-mpc/tests/unit/api/test_tdh2.cpp <<'CPP'

          TEST(ApiTdh2, IntegrityMutationSanitizedCampaign) {
            constexpr int n=3;
            std::vector<std::shared_ptr<mpc_net_context_t>> peers; for(int i=0;i<n;i++)peers.push_back(std::make_shared<mpc_net_context_t>(i)); for(auto&p:peers)p->init_with_peers(peers);
            std::vector<std::shared_ptr<local_api_transport_t>> tr; for(auto&p:peers)tr.push_back(std::make_shared<local_api_transport_t>(p));
            std::vector<std::string> names={"p0","p1","p2"}; std::vector<std::string_view> nv={names[0],names[1],names[2]};
            std::vector<buf_t> pks(n),priv(n),sids(n); std::vector<std::vector<buf_t>> pubs(n); std::vector<error_t> rvs;
            run_mp(peers,[&](int i){job_mp_t job{(party_idx_t)i,nv,*tr[i]};return coinbase::api::tdh2::dkg_additive(job,curve_id::secp256k1,pks[i],pubs[i],priv[i],sids[i]);},rvs);
            for(auto rv:rvs)ASSERT_EQ(rv,SUCCESS); for(int i=1;i<n;i++){ASSERT_EQ(pks[0],pks[i]);ASSERT_EQ(pubs[0],pubs[i]);}

            buf_t plain(32);for(int i=0;i<plain.size();i++)plain[i]=(uint8_t)(0x90+i);buf_t label("tdh2-integrity");buf_t ct;
            ASSERT_EQ(coinbase::api::tdh2::encrypt(pks[0],plain,label,ct),SUCCESS);ASSERT_EQ(coinbase::api::tdh2::verify(pks[0],ct,label),SUCCESS);
            std::vector<buf_t> parts(n);for(int i=0;i<n;i++)ASSERT_EQ(coinbase::api::tdh2::partial_decrypt(priv[i],ct,label,parts[i]),SUCCESS);
            auto pubm=buf_t::to_mems(pubs[0]);auto partm=buf_t::to_mems(parts);buf_t dec;ASSERT_EQ(coinbase::api::tdh2::combine_additive(pks[0],pubm,label,partm,ct,dec),SUCCESS);ASSERT_EQ(dec,plain);

            std::ofstream out("/code/tdh2-results.txt",std::ios::trunc);out<<"ct="<<ct.size()<<" parts=";for(auto&p:parts)out<<p.size()<<',';out<<"\n";
            auto test_combine=[&](const char*kind,int id,const std::vector<buf_t>& qbuf,const std::vector<buf_t>& pbuf,const buf_t& c){
              auto qm=buf_t::to_mems(qbuf);auto pm=buf_t::to_mems(pbuf);buf_t o;bool exc=false;error_t rv=E_GENERAL;try{rv=coinbase::api::tdh2::combine_additive(pks[0],qm,label,pm,c,o);}catch(...){exc=true;}
              bool wrong_success=(rv==SUCCESS && o!=plain);if(rv==SUCCESS||exc)out<<kind<<" id="<<id<<" rv="<<rv<<" exc="<<exc<<" out="<<o.size()<<" wrong_success="<<wrong_success<<"\n";out.flush();
            };

            const int positions=80;
            for(int k=0;k<positions;k++){int pos=(int)((int64_t)k*(ct.size()-1)/(positions-1));for(int mode=0;mode<3;mode++){buf_t m(ct);m[pos]^=(uint8_t)(mode==0?1:mode==1?0x80:0xFF);error_t vr=coinbase::api::tdh2::verify(pks[0],m,label);buf_t pd;error_t pr=coinbase::api::tdh2::partial_decrypt(priv[0],m,label,pd);if(vr==SUCCESS||pr==SUCCESS)out<<"ctflip k="<<k<<" mode="<<mode<<" vr="<<vr<<" pr="<<pr<<" pd="<<pd.size()<<"\n";test_combine("ctflip",k*3+mode,pubs[0],parts,m);}}
            for(int cut=1;cut<64;cut++){int keep=(int)((int64_t)cut*(ct.size()-1)/64);if(keep<1)keep=1;buf_t m(ct.take(keep));test_combine("cttrunc",cut,pubs[0],parts,m);}

            for(int idx=0;idx<n;idx++){
              int sz=parts[idx].size();for(int k=0;k<64;k++){int pos=(int)((int64_t)k*(sz-1)/63);std::vector<buf_t> ps=parts;ps[idx][pos]^=(uint8_t)(0x80|(1<<(k%7)));test_combine("partflip",idx*1000+k,pubs[0],ps,ct);}
              for(int cut=1;cut<20;cut++){int keep=(int)((int64_t)cut*(sz-1)/20);if(keep<1)keep=1;std::vector<buf_t> ps=parts;ps[idx]=buf_t(ps[idx].take(keep));test_combine("parttrunc",idx*1000+100+cut,pubs[0],ps,ct);}
            }

            for(int idx=0;idx<n;idx++){
              int sz=pubs[0][idx].size();for(int k=0;k<32;k++){int pos=(int)((int64_t)k*(sz-1)/31);std::vector<buf_t> qs=pubs[0];qs[idx][pos]^=(uint8_t)(0x80|(1<<(k%7)));test_combine("pubflip",idx*1000+k,qs,parts,ct);}
            }
            out<<"complete\n";
          }
          CPP

      - name: Build and run ASAN UBSAN TDH2 campaign
        shell: bash
        run: |
          set -euo pipefail
          cd cb-mpc
          make image >/tmp/image-build.log 2>&1
          set +e
          timeout 40m docker run --rm -v "$PWD":/code -t cb-mpc bash -lc 'make sanitize filter=ApiTdh2.IntegrityMutationSanitizedCampaign' >/tmp/sanitize.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >/tmp/status.txt
          cp tdh2-results.txt /tmp/tdh2-results.txt 2>/dev/null || echo 'no tdh2 result file' >/tmp/tdh2-results.txt
          echo 'TDH2 sanitizer campaign finished; detailed result encrypted next'

      - name: Encrypt results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7/qgkP0IpHQIfyKQYwvS
          Ufx+aug+cHi7A8R3ar0n/FT2FBK0aphD0Jyfp5aq87UIXIjfGA9gdtRsnrxB/iBa
          xtyXtb6m0KKTPU6uPFuWt7e/2BFR7ic3L54hAjJy9Akrstloqbd7CVQULC8okIQS
          1xQYEBW8URYsAo2L748AckGQjy2V15jHq7fC6MLeK4p+/D1iFijMVGFvBvLpUgSN
          RnJagoaiR1eJjUQfkA2+31PGTevs8405ZUnWYJ3w4ikHwdEf65OV1AovGuIBwekn
          Xst6y7BEid59Gv5EU+nhQg5TRDrpIYo7qETP9BwqJmHqw6yaEg4sqJGpkrr3Ne5N
          pQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          mkdir -p /tmp/r;cp /tmp/status.txt /tmp/r/ 2>/dev/null||true;cp /tmp/tdh2-results.txt /tmp/r/ 2>/dev/null||true;cp /tmp/sanitize.log /tmp/r/ 2>/dev/null||true;cp /tmp/image-build.log /tmp/r/ 2>/dev/null||true
          tar -C /tmp/r -czf /tmp/r.tar.gz .;openssl rand -hex 32 >/tmp/pass.txt;openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/r.tar.gz -out /tmp/r.tar.gz.enc -pass file:/tmp/pass.txt;openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/pass.txt -out /tmp/pass.txt.enc
          rm -rf /tmp/r /tmp/r.tar.gz /tmp/pass.txt /tmp/status.txt /tmp/tdh2-results.txt /tmp/sanitize.log /tmp/image-build.log

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbmpc-tdh2-integrity-v9
          path: |
            /tmp/r.tar.gz.enc
            /tmp/pass.txt.enc
          retention-days: 1
