name: Syfe UAT Encrypted Recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/syfe-uat-encrypted-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install low-impact recon tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          export GOBIN="$RUNNER_TEMP/bin"
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest >/dev/null 2>&1
          go install github.com/projectdiscovery/katana/cmd/katana@latest >/dev/null 2>&1
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest >/dev/null 2>&1

      - name: Run scoped low-rate UAT reconnaissance
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          OUT="$RUNNER_TEMP/syfe-findings"
          mkdir -p "$OUT"

          cat > "$OUT/targets.txt" <<'EOF'
          https://uat-bugbounty.nonprod.syfe.com
          https://api-uat-bugbounty.nonprod.syfe.com
          https://alfred-uat-31.nonprod.syfe.com
          EOF

          # Baseline only: one request per target.
          : > "$OUT/baseline.txt"
          while read -r u; do
            printf '=== %s ===\n' "$u" >> "$OUT/baseline.txt"
            curl -ksS --max-time 10 -D - -o /dev/null "$u/" >> "$OUT/baseline.txt" 2>&1 || true
            printf '\n' >> "$OUT/baseline.txt"
          done < "$OUT/targets.txt"

          # Low-rate technology/status probing.
          httpx -l "$OUT/targets.txt" -silent -status-code -title -tech-detect -follow-redirects \
            -rate-limit 2 -threads 1 -timeout 8 -retries 0 > "$OUT/httpx.txt" 2>/dev/null || true

          # Crawl only the primary UAT app, depth 2, 2 req/s, single worker.
          katana -u https://uat-bugbounty.nonprod.syfe.com -silent -d 2 -rl 2 -c 1 -p 1 \
            -timeout 8 -retry 0 -jc -kf all -fs fqdn -o "$OUT/katana.txt" >/dev/null 2>&1 || true

          # Extract likely API/parameter-bearing URLs for later manual validation.
          grep -E '(^|[?&])[^=]+=|/api/|/v[0-9]+/' "$OUT/katana.txt" 2>/dev/null | sort -u > "$OUT/candidate-urls.txt" || true

          # High/critical templates only; exclude intrusive/DoS/fuzz/bruteforce classes.
          nuclei -l "$OUT/targets.txt" -silent -severity high,critical \
            -exclude-tags dos,fuzz,intrusive,bruteforce,credential-stuffing,token-spray \
            -rl 2 -c 1 -bs 1 -timeout 8 -retries 0 -jsonl -o "$OUT/nuclei.jsonl" >/dev/null 2>&1 || true

          # Keep a small manifest without disclosing findings in logs.
          {
            echo "completed_utc=$(date -u +%FT%TZ)"
            echo "targets=3"
            echo "katana_urls=$(wc -l < "$OUT/katana.txt" 2>/dev/null || echo 0)"
            echo "candidate_urls=$(wc -l < "$OUT/candidate-urls.txt" 2>/dev/null || echo 0)"
            echo "nuclei_findings=$(wc -l < "$OUT/nuclei.jsonl" 2>/dev/null || echo 0)"
          } > "$OUT/manifest.txt"

      - name: Encrypt results before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/syfe-findings"
          WORK="$RUNNER_TEMP/encrypted"
          mkdir -p "$WORK"

          cat > "$WORK/public.pem" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzbqegX5Edpcn7crEABJI
          wnTTy7ciC4RBb0sz5YN2BN8r7U7rNGh9/cT+INRDL6Rb/6RQeCDmpHj4TOU9eFJQ
          of+aC2GCeaT9b3Ohl5jY9VYMNZ/ySZZhgeDvTZWQn8fpqsCoaMw3cW4k77nbINXy
          1Wa1SiaC+Q+xXbgqAC4g9Gvy99rS4XfooS3nYLHPGXN8k0V6AYmWAGdvuuhFu887
          uqw8JWWG/DlnjpCNkjYlJaU0xdrplTzNWdutizfrOkrS8Vxvi8yvHUBEHmRUzbEa
          PGTkjULDSpE4TeZOhR6YjYE2v+ZHKDxnyjGBCykqwh181e9vM8tUnbXjAqWpHQxa
          djQdJtACA0C5o1fwII6GRJ2dwPdvE4f7+l4jaAT8v0reWVnRJn6xVx2qae1/BEAI
          KHlTO/zt/h9PoQSi2UREPGHKaizw6sU434D25SVb8WMuxwGpADNBjmwXf11pNZ9E
          fzV7/OvDeI9vyB4htumx1JJvjL7BYFI4phenCxBVjfxJAgMBAAE=
          -----END PUBLIC KEY-----
          EOF

          tar -C "$RUNNER_TEMP" -czf "$WORK/results.tar.gz" syfe-findings
          openssl rand -out "$WORK/aes.key" 32
          openssl rand -out "$WORK/aes.iv" 16
          openssl enc -aes-256-cbc -K "$(xxd -p -c 256 "$WORK/aes.key")" -iv "$(xxd -p -c 256 "$WORK/aes.iv")" \
            -in "$WORK/results.tar.gz" -out "$WORK/results.enc"
          cat "$WORK/aes.key" "$WORK/aes.iv" > "$WORK/keymaterial.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" -pkeyopt rsa_padding_mode:oaep \
            -in "$WORK/keymaterial.bin" -out "$WORK/keymaterial.enc"
          rm -f "$WORK/aes.key" "$WORK/aes.iv" "$WORK/keymaterial.bin" "$WORK/results.tar.gz" "$WORK/public.pem"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: syfe-uat-encrypted-results
          path: |
            ${{ runner.temp }}/encrypted/results.enc
            ${{ runner.temp }}/encrypted/keymaterial.enc
          retention-days: 1
          compression-level: 0
