name: Syfe UAT Encrypted Recon

on:
  push:
    paths:
      - '.github/workflows/syfe-uat-encrypted-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Targeted low-rate UAT checks
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/syfe-findings"
          mkdir -p "$OUT"
          cat > "$OUT/targets.txt" <<'EOF'
          https://uat-bugbounty.nonprod.syfe.com
          https://api-uat-bugbounty.nonprod.syfe.com
          https://alfred-uat-31.nonprod.syfe.com
          EOF
          cat > "$OUT/paths.txt" <<'EOF'
          /
          /robots.txt
          /sitemap.xml
          /.well-known/security.txt
          /.git/HEAD
          /.env
          /swagger
          /swagger-ui
          /swagger-ui/index.html
          /api-docs
          /v2/api-docs
          /v3/api-docs
          /openapi.json
          /openapi.yaml
          /graphql
          /graphiql
          /health
          /healthz
          /status
          /version
          /metrics
          /actuator
          /actuator/health
          /actuator/env
          /debug
          /admin
          /login
          /auth
          /api
          /api/v1
          /api/v2
          EOF
          : > "$OUT/path-results.tsv"
          while read -r base; do
            while read -r path; do
              url="$base$path"
              tmp="$RUNNER_TEMP/body.$$"
              headers="$RUNNER_TEMP/headers.$$"
              code=$(curl -ksS --max-time 8 --connect-timeout 5 -D "$headers" -o "$tmp" -w '%{http_code}' "$url" || echo 000)
              ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{sub(/\r$/,"",$0); print substr($0,index($0,$2))}' "$headers" | tail -1 | tr '\t' ' ')
              len=$(wc -c < "$tmp" 2>/dev/null || echo 0)
              loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$0); print $2}' "$headers" | tail -1)
              printf '%s\t%s\t%s\t%s\t%s\n' "$code" "$len" "$ctype" "$loc" "$url" >> "$OUT/path-results.tsv"
              sleep 0.5
            done < "$OUT/paths.txt"
          done < "$OUT/targets.txt"
          : > "$OUT/cors.txt"
          while read -r base; do
            echo "=== $base ===" >> "$OUT/cors.txt"
            curl -ksS --max-time 8 -D - -o /dev/null -X OPTIONS "$base/" \
              -H 'Origin: https://attacker.example' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type' >> "$OUT/cors.txt" 2>&1 || true
          done < "$OUT/targets.txt"
          awk -F '\t' '$1 !~ /^(401|403|404|000)$/ {print}' "$OUT/path-results.tsv" > "$OUT/interesting.tsv" || true
          {
            echo "completed_utc=$(date -u +%FT%TZ)"
            echo "requests=$(wc -l < "$OUT/path-results.tsv")"
            echo "interesting=$(wc -l < "$OUT/interesting.tsv")"
          } > "$OUT/manifest.txt"
      - name: Encrypt results
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/encrypted"; mkdir -p "$WORK"
          cat > "$WORK/public.pem" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzbqegX5Edpcn7crEABJI
          wnTTy7ciC4RBb0sz5YN2BN8r7U7rNGh9/cT+INRDL6Rb/6RQeCDmpHj4TOU9eFJQ
          of+aC2GCeaT9b3Ohl5jY9VYMNZ/ySZZhgeDvTZWQn8fpqsCoaMw3cW4k77nbINXy
          1Wa1SiaC+Q+xXbgqAC4g9Gvy99rS4XfooS3nYLHPGXN8k0V6AYmWAGdvuuhFu887
          uqw8JWWG/DlnjpCNkjYlJaU0xdrplTzNWdutizfrOkrS8Vxvi8yvHUBEHmRUzbEa
          PGTkjULDSpE4TeZOhR6YjYE2v+ZHKDxnyjGBCykqwh181e9vM8tUnbXjAqWpHQxa
          djQdJtACA0C5o1fwII6GRJ2dwPdvE4f7+l4jaAT8v0reWVnRJn6xVx2qae1/BEAI
          KHlTO/zt/h9PoQSi2UREPGHKaizw6sU434D25SVb8WMuxwGpADNBjmwXf11pNZ9E
          fzV7/OvDeI9vyB4htumx1JJvjL7BYFI4phenCxBVjfxJAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C "$RUNNER_TEMP" -czf "$WORK/results.tar.gz" syfe-findings
          openssl rand -out "$WORK/aes.key" 32; openssl rand -out "$WORK/aes.iv" 16
          openssl enc -aes-256-cbc -K "$(xxd -p -c 256 "$WORK/aes.key")" -iv "$(xxd -p -c 256 "$WORK/aes.iv")" -in "$WORK/results.tar.gz" -out "$WORK/results.enc"
          cat "$WORK/aes.key" "$WORK/aes.iv" > "$WORK/keymaterial.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$WORK/public.pem" -pkeyopt rsa_padding_mode:oaep -in "$WORK/keymaterial.bin" -out "$WORK/keymaterial.enc"
          rm -f "$WORK/aes.key" "$WORK/aes.iv" "$WORK/keymaterial.bin" "$WORK/results.tar.gz" "$WORK/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: syfe-uat-encrypted-targeted
          path: |
            ${{ runner.temp }}/encrypted/results.enc
            ${{ runner.temp }}/encrypted/keymaterial.enc
          retention-days: 1
          compression-level: 0
