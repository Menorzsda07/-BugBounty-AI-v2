name: BugBounty AI Multi-Program 8-Runner Scanner
on:
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Reviewed multi-program HackerOne scope config JSON'
        required: true
        default: 'bugbounty_runner/config.example.json'
permissions:
  contents: read
jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        runner: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install requests
      - name: Run scanner pack on all reviewed programs and domains
        run: |
          mkdir -p results
          python bugbounty_runner/multi_scan.py \
            --config '${{ inputs.config_path }}' \
            --runner '${{ matrix.runner }}' \
            --out 'results/runner-${{ matrix.runner }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-result-${{ matrix.runner }}
          path: results/runner-${{ matrix.runner }}.json
          retention-days: 2

  analyze:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-result-*
          path: results
          merge-multiple: true
      - name: Aggregate, deduplicate and rank candidates
        run: |
          python bugbounty_runner/analyze.py | tee results/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: multi-program-combined-analysis
          path: results/
          retention-days: 2
